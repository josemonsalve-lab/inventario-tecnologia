  const us = A.unidades.filter(u => u.lote === l.lote);

async function deshacerImportacion(){
  const lote = ctx.lote;
  const us = A.unidades.filter(u => u.lote === lote);
  if(!us.length) return cerrarModal();
  A.unidades = A.unidades.filter(u => u.lote !== lote);
  if(REMOTO){
    try{ await API.req("DELETE", "unidades?lote=eq." + lote); }
    catch(e){ fallo(e, "unidades"); return cerrarModal(); }
  } else await guardar("unidades");

  /* modelos creados por esa importación que quedaron sin equipos */
  const huerfanos = A.modelos.filter(m => m.categoria === "Sin clasificar" &&
    !A.unidades.some(u => u.codigo === m.codigo));
  for(const m of huerfanos){
    A.modelos = A.modelos.filter(x => x.id !== m.id);
    await borrarFila("modelos", m.id);
  }
  await Store.del("ultimoLote");
  registrar("Se deshizo una importación de " + us.length + " equipos", "");
  cerrarModal(); pintar();
  avisar(us.length + " equipos eliminados");
}

  abrirModal(

async function guardarConexion(){

async function hacerImportar(){
  const d = ctx.datos;
  if(!d || !d.filas.length) return avisar("Primero elige un archivo");
  const prov = val("proveedorId");
  const lote = uuid(), ahora = new Date().toISOString();
  const codigos = new Set(A.modelos.map(m => m.codigo));
  const modelosNuevos = [], unidadesNuevas = [], proveedoresNuevos = [];
  const provPorNombre = {};
  for(const p of A.proveedores) provPorNombre[sinTildes(p.nombre)] = p.id;
  for(const f of d.filas){
    if(!f.proveedor) continue;
    const clave = sinTildes(f.proveedor);
    if(!provPorNombre[clave]){
      const p = { id: uuid(), nombre: f.proveedor.trim(), contacto: "", telefono: "", email: "",
        origen: "Local", plazo: null, notas: "Creado al importar equipos" };
      A.proveedores.push(p); proveedoresNuevos.push(p);
      provPorNombre[clave] = p.id;
    }
    f.proveedorId = provPorNombre[clave];
  }
  if(proveedoresNuevos.length) await persistirLote("proveedores", proveedoresNuevos);
  for(const f of d.filas){
    if(!codigos.has(f.codigo)){
      const m = { id: uuid(), codigo: f.codigo, modelo: "", nombre: f.codigo, categoria: "Sin clasificar",
        minimo: 0, proveedorId: prov, fotos: [], ficha: {}, func: {} };
      A.modelos.push(m); modelosNuevos.push(m); codigos.add(f.codigo);
    }
    const u = { id: uuid(), serie: f.serie, codigo: f.codigo, situacion: f.situacion, estado: "Nuevo",
      cliente: f.cliente, entrega: f.entrega, ingreso: f.ingreso, tipo: f.tipo,
      vendedor: f.vendedor, instalador: f.instalador, lote: lote, creado: ahora,
      proveedorId: f.proveedorId || prov, facturaId: "", oc: "", costo: null, ubicacion: "", obs: "" };
    A.unidades.unshift(u); unidadesNuevas.push(u);
  }
  await persistirLote("modelos", modelosNuevos);
  await persistirLote("unidades", unidadesNuevas);
  await Store.set("ultimoLote", { lote: lote, archivo: ctx.archivo || "Excel", fecha: ahora, n: unidadesNuevas.length });
  registrar("Importación de " + unidadesNuevas.length + " equipos desde " + (ctx.archivo || "Excel"), "");
  const n = unidadesNuevas.length, nm = modelosNuevos.length, rep = d.repetidas;
  cerrarModal(); pintar();
  avisar(n + " importados" + (rep ? ", " + rep + " repetidos" : "") + (nm ? ", " + nm + " modelos nuevos" : "") +
    (proveedoresNuevos.length ? ", " + proveedoresNuevos.length + " proveedores nuevos" : ""));
}

function exportar(){
  const cab = ["serie","codigo","modelo","situacion","estado","cliente","vendedor","instalador","tipo","ubicacion","proveedor","factura","orden_compra","costo_clp","fecha_ingreso","fecha_entrega","observacion"];
  const filas = A.unidades.map(u => {
    const m = modelo(u.codigo), p = proveedor(u.proveedorId), fa = factura(u.facturaId);
    return [u.serie, u.codigo, m ? (m.modelo || "") : "", u.situacion, u.estado, u.cliente, u.vendedor || "", u.instalador || "", u.tipo, u.ubicacion,
      p ? p.nombre : "", fa ? (fa.numero || "") : "", u.oc, u.costo == null ? "" : u.costo, u.ingreso, u.entrega,
      (u.obs || "").replace(/\n/g," ")];
  });
  descargarCSV("inventario-equipos-" + hoy(), cab, filas);
}

async function cargarCatalogo(){
  const ya = new Set(A.modelos.map(m => m.codigo));
  const agregados = [];
  let n = 0;
  for(const c of CATALOGO_REX){
    if(ya.has(c.codigo)) continue;
    const m = { id: uuid(), codigo: c.codigo, modelo: c.modelo, nombre: c.nombre, categoria: c.categoria,
      ventaUF: c.ventaUF, arriendoUF: c.arriendoUF, minimo: 0, proveedorId: "", fotos: [],
      ficha: c.ficha || {}, func: c.func || {} };
    A.modelos.push(m); agregados.push(m); n++;
  }
  await persistirLote("modelos", agregados);
  pintar(); avisar(n + " modelos cargados");
}

async function borrarTodo(){
  for(const m of A.modelos){ for(const fid of (m.fotos || [m.id])) await Store.del(fotoKey(fid)); }
  for(const u of A.unidades) await Store.del(fotoKey("u" + u.id));
  A.modelos = []; A.unidades = []; A.proveedores = []; A.movs = []; A.fotos = {};
  if(REMOTO){
    for(const t of ["unidades","movimientos","modelos","fotos","proveedores"]){
      try{ await API.req("DELETE", t + "?id=not.is.null"); }catch(e){ avisar("No se pudo vaciar " + t); }
    }
  } else await guardarTodo();
  cerrarModal(); pintar(); avisar("Datos borrados");
}

/* ------------------------------------------------------------------ eventos */
document.addEventListener("click", async ev => {
  const t = ev.target.closest("[data-nav],[data-cat],[data-bajos],[data-sit],[data-modelo],[data-unidad],[data-proveedor],[data-accion],[data-abrir],[data-cerrar],[data-velo],[data-foto-idx],[data-quitar-foto],[data-factura],[data-quitar-serie],[data-cot],[data-quitar-linea],[data-cotiza],[data-linea],[data-rep],[data-periodo],[data-panel],[data-col],[data-selfila],[data-vaciarmod],[data-seleq]");
  if(!t) return;
  const d = t.dataset;

  if(d.velo && ev.target === t) return cerrarModal();
  if(d.cerrar) return cerrarModal();

  if(d.nav){ A.vista = d.nav; A.filtro = "Todas"; A.soloBajos = false; A.q = ""; document.getElementById("q").value = ""; return pintar(); }
  if(d.cat){ A.filtro = d.cat; return pintar(); }
  if(d.sit){ A.filtro = d.sit; return pintar(); }
  if(d.bajos){ A.soloBajos = !A.soloBajos; return pintar(); }

  if(d.modelo) return modalFicha(d.modelo);
  if(d.fotoIdx != null){ ctx.idx = Number(d.fotoIdx); return pintarFicha(); }
  if(d.quitarFoto != null){ ctx.fotos.splice(Number(d.quitarFoto), 1); return pintarFormModelo(); }
  if(d.unidad) return modalUnidad(d.unidad);
  if(d.proveedor) return modalProveedor(d.proveedor);
  if(d.factura) return modalFactura(d.factura);
  if(d.cotiza) return abrirCot(d.cotiza);
  if(d.cot){ leerCot(); A.cot[d.cot] = !A.cot[d.cot]; await Store.set("cot", A.cot); return pintar(); }
  if(d.quitarLinea != null){ leerCot(); A.cot.lineas.splice(Number(d.quitarLinea), 1); await Store.set("cot", A.cot); return pintar(); }
  if(d.linea != null){ leerCot(); return modalLinea(Number(d.linea)); }
  if(d.rep){ A.rep.tipo = d.rep; A.rep.panel = ""; return pintar(); }
  if(d.periodo){ A.rep.periodo = d.periodo; A.rep.desde = ""; A.rep.hasta = ""; return pintar(); }
  if(d.panel){ A.rep.panel = A.rep.panel === d.panel ? "" : d.panel; return pintar(); }
  if(d.col){
    const c = A.rep.cols[A.rep.tipo] = A.rep.cols[A.rep.tipo] || {};
    c[d.col] = !c[d.col];
    return pintar();
  }
  if(d.seleq){ A.selEq[d.seleq] = !A.selEq[d.seleq]; return pintar(); }
  if(d.vaciarmod){ ctx.sel[d.vaciarmod] = !ctx.sel[d.vaciarmod]; return pintarVaciar(); }
  if(d.selfila){
    const s = A.rep.sel[A.rep.tipo] = A.rep.sel[A.rep.tipo] || {};
    s[d.selfila] = !s[d.selfila];
    return pintar();
  }
  if(d.quitarSerie != null){ leerIngreso(); ctx.series.splice(Number(d.quitarSerie), 1); return pintarIngreso(); }

  if(d.abrir === "nuevo-modelo") return modalModelo(null);
  if(d.abrir === "nueva-unidad") return modalIngreso(null);
  if(d.abrir === "nuevo-proveedor") return modalProveedor(null);

  const a = d.accion;
  if(a === "entrar") return entrar();
  if(a === "refrescar"){ await actualizarUF(); await sincronizar(); pintar(); return avisar(A.enLinea ? "Inventario actualizado" : "Sin conexión"); }
  if(a === "salir"){
    await API.salir();
    A.modelos = []; A.unidades = []; A.proveedores = []; A.movs = []; A.dispo = []; A.fotos = {}; A.rol = "";
    document.getElementById("vista").innerHTML = "";
    return pintarLogin();
  }
  if(a === "ver-vendedor"){
    if(esAdmin()){ calcularDispoLocal(); A.rol = "vendedor"; } else A.rol = "admin";
    A.vista = "stock"; A.filtro = "Todas"; A.soloBajos = false;
    pintar();
    return avisar(esAdmin() ? "Vista de administrador" : "Vista de vendedor (prueba)");
  }
  if(a === "editar-modelo") return modalModelo(ctx.id);
  if(a === "activar-modelo"){
    const m = A.modelos.find(x => x.id === ctx.id);
    m.activo = !activo(m);
    await persistir("modelos", m);
    pintar();                                     // refresca también el catálogo de atrás
    pintarFicha();
    return avisar(activo(m) ? "Visible para los vendedores" : "Oculto para los vendedores");
  }
  if(a === "nueva-unidad-modelo"){ const m = A.modelos.find(x => x.id === ctx.id); return modalIngreso(m.codigo); }
  if(a === "elegir-foto") return document.getElementById("file").click();
  if(a === "elegir-archivo") return document.getElementById("arch").click();
  if(a === "ver-archivo") return abrirArchivo(factura(ctx.id));
  if(a === "nueva-factura") return modalFactura(null, ctx.id);
  if(a === "guardar-factura") return guardarFactura();
  if(a === "borrar-factura") return borrarFactura();
  if(a === "agregar-serie"){
    const e = document.getElementById("i-serie");
    leerIngreso(); agregarSerie(e ? e.value : ""); return pintarIngreso();
  }
  if(a === "agregar-lista"){
    const e = document.getElementById("i-pega");
    leerIngreso(); agregarSerie(e ? e.value : ""); return pintarIngreso();
  }
  if(a === "guardar-ingreso") return guardarIngreso();
  if(a === "abrir-cotizador"){ A.vista = "cotiza"; return pintar(); }
  if(a === "recargar-datos"){
    A.sinGuardar = false; A.ultimoError = "";
    await sincronizar(); pintar();
    return avisar(A.enLinea ? "Datos recargados del servidor" : "Sigue sin conexión");
  }
  if(a === "pdf-reporte") return reportePDF();
  if(a === "limpiar-filtros"){
    Object.assign(A.rep, { desde: "", hasta: "", situacion: "Todas", categoria: "Todas", proveedorId: "" });
    return pintar();
  }
  if(a === "todas-columnas"){ A.rep.cols[A.rep.tipo] = {}; return pintar(); }
  if(a === "sel-todas"){
    const s = A.rep.sel[A.rep.tipo] = {};
    generarReporte().filas.forEach(f => { s[f.clave] = true; });
    return pintar();
  }
  if(a === "sel-ninguna"){ A.rep.sel[A.rep.tipo] = {}; return pintar(); }
  if(a === "exportar-reporte"){
    const R = generarReporte();
    const D = datosExport(R);
    if(!D.filas.length) return avisar("No hay filas seleccionadas");
    return descargarCSV(R.nombre + "-" + hoy(), D.cab, D.filas);
  }
  if(a === "agregar-linea"){ leerCot(); return modalLinea(); }
  if(a === "guardar-linea"){
    const linea = { codigo: val("l-codigo"), cant: Math.max(1, Number(val("l-cant")) || 1), desc: Number(val("l-desc")) || 0 };
    if(ctx.idx === null || ctx.idx === undefined) A.cot.lineas.push(linea);
    else A.cot.lineas[ctx.idx] = linea;
    await Store.set("cot", A.cot);
    cerrarModal(); return pintar();
  }
  if(a === "quitar-linea-modal"){
    A.cot.lineas.splice(ctx.idx, 1);
    await Store.set("cot", A.cot);
    cerrarModal(); return pintar();
  }
  if(a === "refrescar-uf"){
    avisar("Consultando el valor de la UF…");
    const antes = A.uf;
    await actualizarUF(true);
    if(!A.cot.id) A.cot.uf = A.uf;
    await Store.set("cot", A.cot);
    pintar();
    return avisar(A.ufDia === hoy() ? "UF al día: " + clp(A.uf) : "No se pudo consultar, sigue " + clp(antes));
  }
  if(a === "copiar-cot"){ leerCot(); return copiarCot(); }
  if(a === "pdf-cot"){ leerCot(); await Store.set("cot", A.cot); return cotizacionPDF(); }
  if(a === "guardar-cot") return guardarCot();
  if(a === "nueva-cot"){ A.cot = cotVacia(); await Store.set("cot", A.cot); return pintar(); }
  if(a === "quitar-foto"){
    ctx.foto = null; ctx.fotoCambiada = true;
    const th = document.getElementById("thumb");
    if(!th) return;
    if(ctx.tipo === "unidad"){
      const u = A.unidades.find(x => x.id === ctx.id);
      const m = u ? modelo(u.codigo) : null;
      const g = m ? fotosDe(m) : [];
      th.className = "thumb" + (g.length ? " heredada" : "");
      th.innerHTML = g.length ? '<img src="' + g[0] + '">' : ICONO_EQUIPO;
      return;
    }
    th.innerHTML = '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 9l9-6 9 6v11a1 1 0 01-1 1H4a1 1 0 01-1-1z"/></svg>';
    return;
  }
  if(a === "guardar-modelo") return guardarModelo();
  if(a === "guardar-unidad") return guardarUnidad();
  if(a && a.indexOf("sit-") === 0) return guardarUnidad(a.slice(4));
  if(a === "guardar-proveedor") return guardarProveedor();
  if(a === "borrar-modelo"){
    const m = A.modelos.find(x => x.id === ctx.id);
    if(unidadesDe(m.codigo).length) return avisar("Tiene equipos asociados, elimínalos primero");
    A.modelos = A.modelos.filter(x => x.id !== ctx.id);
    for(const fid of (m.fotos || [ctx.id])){ await guardarFoto(fid, null); delete A.fotos[fid]; }
    await borrarFila("modelos", ctx.id);
    cerrarModal(); pintar(); return avisar("Modelo eliminado");
  }
  if(a === "borrar-unidad"){
    const u = A.unidades.find(x => x.id === ctx.id);
    A.unidades = A.unidades.filter(x => x.id !== ctx.id);
    await guardarFoto("u" + ctx.id, null);
    await borrarFila("unidades", ctx.id);
    registrar("Equipo eliminado del registro", u ? u.serie : "");
    cerrarModal(); pintar(); return avisar("Equipo eliminado");
  }
  if(a === "borrar-proveedor"){
    A.proveedores = A.proveedores.filter(x => x.id !== ctx.id);
    A.unidades.forEach(u => { if(u.proveedorId === ctx.id) u.proveedorId = ""; });
    A.modelos.forEach(m => { if(m.proveedorId === ctx.id) m.proveedorId = ""; });
    await borrarFila("proveedores", ctx.id);
    if(!REMOTO) await guardarTodo();
    cerrarModal(); pintar(); return avisar("Proveedor eliminado");
  }
  if(a === "cargar-catalogo") return cargarCatalogo();
  if(a === "eq-todos"){
    A.selEq = {};
    document.querySelectorAll("[data-seleq]").forEach(b => { A.selEq[b.dataset.seleq] = true; });
    return pintar();
  }
  if(a === "eq-ninguno"){ A.selEq = {}; return pintar(); }
  if(a === "asignar-cliente") return modalAsignarCliente();
  if(a === "guardar-asignacion") return asignarCliente();
  if(a === "cambiar-modelo") return modalCambiarModelo(ctx.id);
  if(a === "guardar-cambio-modelo") return guardarCambioModelo();
  if(a === "mover-modelo") return modalMoverModelo();
  if(a === "confirmar-mover") return moverModelo();
  if(a === "vaciar-equipos") return modalVaciarEquipos();
  if(a === "vaciar-todos"){ modelosConEquipos().forEach(x => { ctx.sel[x.m.codigo] = true; }); return pintarVaciar(); }
  if(a === "vaciar-ninguno"){ ctx.sel = {}; return pintarVaciar(); }
  if(a === "paso-vaciar"){ ctx.paso = 2; return pintarVaciar(); }
  if(a === "volver-vaciar"){ ctx.paso = 1; return pintarVaciar(); }
  if(a === "confirmar-vaciar") return vaciarEquipos();
  if(a === "deshacer-importacion") return modalDeshacer();
  if(a === "confirmar-deshacer") return deshacerImportacion();
  if(a === "conectar") return modalConexion();
  if(a === "guardar-conexion") return guardarConexion();
  if(a === "borrar-conexion"){
    await Store.del("conexion");
    avisar("Conexión borrada");
    return setTimeout(() => location.reload(), 600);
  }
  if(a === "importar") return modalImportar();
  if(a === "elegir-excel") return document.getElementById("excel").click();
  if(a === "plantilla") return plantillaExcel();
  if(a === "hacer-importar") return hacerImportar();
  if(a === "exportar") return exportar();
  if(a === "borrar"){
    return abrirModal('<p>Se eliminan ' + nf.format(A.unidades.length) + ' equipos, ' + nf.format(A.modelos.length) +
      ' modelos, los proveedores y las fotos. No se puede deshacer.</p>' +
      '<button class="btn btn-rojo btn-w" data-accion="confirmar-borrar">Sí, borrar todo</button>' +
      '<button class="btn btn-suave btn-w" data-cerrar="1">Conservar</button>', "Borrar todos los datos");
  }
  if(a === "confirmar-borrar") return borrarTodo();
});

document.addEventListener("change", async ev => {
  if(ev.target.id === "excel"){
    const f = ev.target.files && ev.target.files[0];
    ev.target.value = "";
    if(!f) return;
    ctx.archivo = f.name; ctx.error = ""; ctx.datos = null;
    ctx.pid = val("proveedorId");
    avisar("Leyendo el archivo…");
    try{ ctx.datos = await leerExcelEquipos(f); }
    catch(e){ ctx.error = e.message || "No se pudo leer el archivo"; }
    return pintarImportar();
  }
  if(ev.target.id && ev.target.id.indexOf("r-") === 0){
    const v = ev.target.value;
    if(ev.target.id === "r-desde") A.rep.desde = v;
    if(ev.target.id === "r-hasta") A.rep.hasta = v;
    if(ev.target.id === "r-situacion") A.rep.situacion = v;
    if(ev.target.id === "r-categoria") A.rep.categoria = v;
    if(ev.target.id === "r-proveedor") A.rep.proveedorId = v;
    return pintar();
  }
  if(["c-cliente","c-destino","c-modalidad","c-envio","c-inst","c-fecha","c-visitas","c-horas"].indexOf(ev.target.id) >= 0){
    leerCot();
    await Store.set("cot", A.cot);
    return pintar();
  }
  if(ev.target.id === "arch"){
    const a = ev.target.files && ev.target.files[0];
    ev.target.value = "";
    if(!a) return;
    if(a.size > MAX_ARCHIVO) return avisar("El archivo supera los 8 MB");
    leerFactura();
    if(a.type && a.type.indexOf("image/") === 0){
      try{
        const chico = await comprimir(a, 1600, 0.75);
        const bin = atob(chico.split(",")[1]);
        const bytes = new Uint8Array(bin.length);
        for(let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        ctx.archivoNuevo = new File([bytes], (a.name.replace(/\.[^.]+$/, "") || "factura") + ".jpg", { type: "image/jpeg" });
      }catch(e){ ctx.archivoNuevo = a; }
    } else ctx.archivoNuevo = a;
    leerFactura();
    return pintarFormFactura();
  }
  if(ev.target.id !== "file") return;
  const f = ev.target.files && ev.target.files[0];
  if(!f) return;
  try{
    const data = await comprimir(f, 900, 0.72);
    if(ctx.tipo === "modelo"){
      ctx.fotos.push({ id: "f" + nid(), data: data });
      ev.target.value = "";
      return pintarFormModelo();
    }
    ctx.foto = data; ctx.fotoCambiada = true;
    const th = document.getElementById("thumb");
    if(th){ th.className = "thumb"; th.innerHTML = '<img src="' + data + '">'; }
  }catch(e){ avisar(e.message || "No se pudo procesar la imagen"); }
  ev.target.value = "";
});

document.getElementById("q").addEventListener("input", e => { A.q = e.target.value.trim(); pintar(); });
document.getElementById("fab").addEventListener("click", () => {
  if(A.vista === "proveedores") return modalProveedor(null);
  if(A.vista === "equipos") return modalIngreso(null);

});

/* -------------------------------------------------------------------- sesión */
function calcularDispoLocal(){
  const cods = [...new Set(A.unidades.map(u => u.codigo))];
  A.dispo = cods.map(c => {
    const us = A.unidades.filter(u => u.codigo === c);
    return { codigo: c,
      disponibles: us.filter(u => u.situacion === "Disponible").length,
      reservados: us.filter(u => u.situacion === "Reservado").length,
      revision: us.filter(u => u.situacion === "En revisión").length,
      total: us.length };
  });
}

function pintarLogin(msg){
  document.getElementById("login").innerHTML =
    '<div class="login"><div class="tarjeta-login">' +
    '<img src="logo-rex.png" alt="Rex+" class="logo">' +
    '<h2>Inventario de equipos</h2>' +
    '<p class="mini">Entra con la cuenta que te entregó el administrador del inventario.</p>' +
    '<label class="f"><span>Correo</span><input class="inp" id="l-email" type="email" autocomplete="username" inputmode="email"></label>' +
    '<label class="f"><span>Contraseña</span><input class="inp" id="l-clave" type="password" autocomplete="current-password"></label>' +
    (msg ? '<p class="aviso">' + esc(msg) + '</p>' : "") +
    '<button class="btn btn-celeste btn-w" data-accion="entrar">Entrar</button></div></div>';
  const c = document.getElementById("l-clave");
  if(c) c.addEventListener("keydown", e => { if(e.key === "Enter") entrar(); });
}

async function entrar(){
  const email = val("l-email");
  const clave = (document.getElementById("l-clave") || {}).value || "";
  if(!email || !clave) return pintarLogin("Escribe tu correo y tu contraseña");
  const b = document.querySelector('[data-accion="entrar"]');
  if(b){ b.textContent = "Entrando…"; b.disabled = true; }
  try{
    await API.entrar(email, clave);
    await API.perfil();
    A.rol = Sesion.rol;
    document.getElementById("login").innerHTML = "";
    await arrancarSesion();
    vigilar();
  }catch(e){ pintarLogin(e.message); }
}

async function arrancarSesion(){
  await usarCache();
  pintar();
  await sincronizar();
  pintar();
  for(const m of A.modelos){ await cargarFotosModelo(m); }
  pintar();
}

function vigilar(){
  if(A.vigilando) return;
  A.vigilando = true;
  setInterval(async () => {
    if(!REMOTO || document.hidden || document.getElementById("modal").innerHTML || !Sesion.rol) return;
    await sincronizar(true); pintar();
  }, 20000);
  setInterval(() => { if(!document.hidden) pintarEstado(); }, 15000);
  window.addEventListener("focus", async () => {
    if(REMOTO && Sesion.rol && !document.getElementById("modal").innerHTML){ await sincronizar(true); pintar(); }
  });
}

/* -------------------------------------------------------------------- arranque */
(async function inicio(){
  await Store.iniciar();
  try{
    const guardada = await Store.get("conexion");
    if(conexionValida(guardada)){ CFG = guardada; REMOTO = true; }
  }catch(e){}
  await actualizarUF();
  A.cot = (await Store.get("cot")) || cotVacia();
  if(!A.cot.id && A.uf) A.cot.uf = A.uf;

  if(!REMOTO){                                   // modo local: un solo dispositivo
    A.rol = "admin";
    A.modelos = (await Store.get("modelos")) || [];
    A.proveedores = (await Store.get("proveedores")) || [];
    A.unidades = (await Store.get("unidades")) || [];
    A.movs = (await Store.get("movs")) || [];
    A.facturas = (await Store.get("facturas")) || [];
    A.cotizaciones = (await Store.get("cotizaciones")) || [];
    pintar();
    for(const m of A.modelos){ await cargarFotosModelo(m); }
    pintar();
    return;
  }

  const s = await Store.get("sesion");
  if(s && s.token){
    Object.assign(Sesion, s);
    try{ await API.perfil(); A.rol = Sesion.rol; }
    catch(e){
      try{ await API.renovar(); await API.perfil(); A.rol = Sesion.rol; }
      catch(e2){ Sesion.token = ""; }
    }
  }
  if(!Sesion.rol){
    if(await usarCache()){ A.rol = (await Store.get("cache")).rol || "vendedor"; }
    return pintarLogin();
  }
  await arrancarSesion();
  vigilar();
})();

/* Cualquier error no controlado queda visible: sirve para diagnosticar en el teléfono. */
window.addEventListener("error", ev => {
  A.ultimoError = "Error: " + (ev.message || "") + (ev.filename ? " (" + String(ev.filename).split("/").pop() + ":" + ev.lineno + ")" : "");
  A.sinGuardar = true;
  try{ pintar(); }catch(e){}
});
window.addEventListener("unhandledrejection", ev => {
  const r = ev.reason;
  A.ultimoError = "Error: " + ((r && r.message) || r);
  A.sinGuardar = true;
  try{ pintar(); }catch(e){}
});

let promptInstalar = null;
window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault(); promptInstalar = e;
  const b = document.getElementById("btn-instalar");
  b.hidden = false;
  b.onclick = async () => { b.hidden = true; promptInstalar.prompt(); promptInstalar = null; };
});
if("serviceWorker" in navigator){
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
