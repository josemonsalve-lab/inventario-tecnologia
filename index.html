<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a5c85">
<meta name="mobile-web-app-capable" content="yes">
<title>Inventario de equipos</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  /* colores tomados del logo: celeste #00BAFF y lima #BEDA69 */
  --azul:#0a5c85; --celeste:#00baff; --cielo:#d4f1ff; --lima:#beda69;
  --lima-soft:#eef6d9; --lima-texto:#4e6a16;
  --rojo:#c0392b; --rojo-soft:#fdecea; --n700:#2c3e4a; --n500:#68808d;
  --linea:#e2ecf2; --fondo:#f5fafd;
  --font:'Red Hat Display',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* el atributo hidden debe ganarle a cualquier display de las clases */
[hidden]{display:none !important}
html,body{margin:0;padding:0}
body{font-family:var(--font);background:var(--fondo);color:var(--n700);font-size:15px;padding-bottom:86px}
button,input,select,textarea{font-family:var(--font);font-size:15px}
button{cursor:pointer;border:0;background:none;color:inherit}
.wrap{max-width:900px;margin:0 auto;padding:0 14px}

/* cabecera */
header{background:#fff;border-bottom:1px solid var(--linea);position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top)}
.hd{display:flex;align-items:center;gap:9px;padding:11px 0}
.hd .logo{height:23px;width:auto;display:block;flex-shrink:0}
.hd h1{font-size:16px;font-weight:900;color:var(--azul);margin:0;flex:1;
  border-left:1px solid var(--linea);padding-left:9px;line-height:1.2}
.busca{position:relative;padding:0 0 12px}
.busca input{width:100%;padding:10px 12px 10px 36px;border:1px solid var(--linea);border-radius:10px;outline:none}
.busca svg{position:absolute;left:11px;top:9px;color:var(--n500)}
.resumen{background:var(--cielo);color:var(--azul)}
.resumen .g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 0}
.resumen b{display:block;font-size:22px;font-weight:900;line-height:1.1}
.resumen span{font-size:12px}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:7px;padding:12px 0}
.chip{padding:6px 13px;border-radius:100px;border:1px solid var(--linea);background:#fff;color:var(--azul);font-weight:700;font-size:13px}
.chip.on{background:var(--azul);color:#fff;border-color:var(--azul)}
.chip.alerta{color:var(--rojo);border-color:var(--rojo)}
.chip.alerta.on{background:var(--rojo);color:#fff}

/* tarjetas */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:620px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:860px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:#fff;border:1px solid var(--linea);border-radius:15px;overflow:hidden;display:flex;flex-direction:column;text-align:left;width:100%}
.foto{aspect-ratio:4/3;background:#eef3f8;position:relative;display:flex;align-items:center;justify-content:center;color:#b9c6d3}
.foto img{width:100%;height:100%;object-fit:cover;display:block}
.card .b{padding:10px;display:flex;flex-direction:column;gap:3px;flex:1}
.card .n{font-weight:700;color:var(--azul);line-height:1.2;font-size:14px}
.card .s{font-size:11px;color:var(--n500)}
.card .q{margin-top:6px;display:flex;align-items:baseline;gap:5px}
.card .q b{font-size:22px;font-weight:900}
.badge{position:absolute;top:8px;left:8px;background:var(--rojo);color:#fff;border-radius:100px;font-size:11px;font-weight:700;padding:3px 9px}
.badge.ok{background:var(--azul)}

/* listas */
.lista{display:flex;flex-direction:column;gap:8px}
.fila{background:#fff;border:1px solid var(--linea);border-radius:12px;padding:11px 13px;display:flex;align-items:center;gap:11px;width:100%;text-align:left}
.fila .t{flex:1;min-width:0}
.fila .t b{display:block;color:var(--azul);font-size:14px}
.fila .t span{font-size:12px;color:var(--n500);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pt{font-size:11px;font-weight:700;padding:3px 9px;border-radius:100px;white-space:nowrap}
.pt-disp{background:var(--lima-soft);color:var(--lima-texto)}
.pt-ent{background:#eef1f5;color:var(--n500)}
.pt-rev{background:#fff4e0;color:#a76a00}
.pt-res{background:var(--cielo);color:var(--azul)}
.pt-baja{background:var(--rojo-soft);color:var(--rojo)}

/* botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:700;padding:11px 20px;border-radius:100px;border:2px solid transparent}
.btn-azul{background:var(--azul);color:#fff;border-color:var(--azul)}
.btn-celeste{background:var(--celeste);color:#fff;border-color:var(--celeste)}
.btn-linea{background:#fff;color:var(--azul);border-color:var(--azul)}
.btn-suave{background:#fff;color:var(--n500);border-color:var(--linea)}
.btn-rojo{background:#fff;color:var(--rojo);border-color:var(--rojo)}
.btn-sm{padding:7px 14px;font-size:13px}
.btn-w{width:100%}
.fab{position:fixed;right:16px;bottom:calc(78px + env(safe-area-inset-bottom));z-index:30;background:var(--celeste);color:#fff;width:56px;height:56px;border-radius:100px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,120,180,.35)}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--linea);display:flex;z-index:40;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--n500);font-size:10px;font-weight:700}
nav button.on{color:var(--azul)}

/* modal */
.velo{position:fixed;inset:0;background:rgba(15,35,55,.55);z-index:60;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:620px){.velo{align-items:center;padding:16px}}
.hoja{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0}
@media(min-width:620px){.hoja{border-radius:20px}}
.hoja-hd{position:sticky;top:0;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid var(--linea);z-index:2}
.hoja-hd h2{margin:0;font-size:17px;font-weight:900;color:var(--azul)}
.hoja-bd{padding:18px;display:flex;flex-direction:column;gap:14px}
label.f{display:block}
label.f>span{display:block;font-size:13px;font-weight:700;color:var(--azul);margin-bottom:4px}
.inp{width:100%;padding:10px 12px;border:1px solid var(--linea);border-radius:10px;outline:none;background:#fff;color:var(--n700)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.aviso{background:var(--rojo-soft);color:var(--rojo);padding:9px 12px;border-radius:10px;font-size:13px;font-weight:700}
.vacio{background:#fff;border:1px solid var(--linea);border-radius:15px;padding:40px 22px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.vacio b{color:var(--azul)}
.vacio p{margin:0;color:var(--n500);font-size:13.5px;max-width:280px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));background:var(--azul);color:#fff;padding:10px 20px;border-radius:100px;font-weight:700;z-index:70;font-size:14px}
.sec{font-size:13px;font-weight:900;color:var(--azul);margin:18px 0 8px}
.mini{font-size:12px;color:var(--n500)}
.thumb{width:110px;height:110px;border-radius:15px;background:#eef3f8;border:1px solid var(--linea);overflow:hidden;display:flex;align-items:center;justify-content:center;color:#b9c6d3;flex-shrink:0}
.thumb img{width:100%;height:100%;object-fit:cover}
.pastilla{display:inline-block;background:var(--cielo);color:var(--azul);border-radius:100px;padding:3px 10px;font-size:12px;font-weight:700}
/* galeria */
.galeria{width:100%;aspect-ratio:4/3;border-radius:15px;overflow:hidden;background:#eef3f8;display:flex;align-items:center;justify-content:center;color:#b9c6d3;padding:6px}
/* la foto se muestra completa dentro del marco, sin recortar */
.galeria img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;border-radius:10px}
.tiras{display:flex;gap:8px;flex-wrap:wrap}
.tira{width:58px;height:58px;border-radius:10px;overflow:hidden;border:2px solid var(--linea);position:relative;flex-shrink:0}
.tira.on{border-color:var(--celeste)}
.tira img{width:100%;height:100%;object-fit:cover}
.tira .x{position:absolute;top:-1px;right:-1px;background:var(--rojo);color:#fff;width:20px;height:20px;border-radius:0 8px 0 8px;font-size:12px;line-height:20px;text-align:center;font-weight:700}
.marca{width:20px;height:20px;flex-shrink:0;border-radius:6px;border:2px solid #86b8d2;background:#eef6fb;
  display:flex;align-items:center;justify-content:center;transition:background .12s,border-color .12s}
.marca:active{background:#d7ecf7}
.marca.on{background:var(--celeste);border-color:var(--celeste);box-shadow:0 0 0 3px rgba(0,186,255,.2)}
.fila.sel{background:#e9f7ff;border-color:var(--celeste)}
.mini-foto{width:46px;height:46px;border-radius:10px;overflow:hidden;background:#eef3f8;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;color:#b9c6d3;position:relative}
.mini-foto img{width:100%;height:100%;object-fit:cover}
.heredada{opacity:.92}
.tira.mas{display:flex;align-items:center;justify-content:center;border-style:dashed;color:var(--azul);font-size:24px;font-weight:700;background:#fff}
/* ficha */
.specs{width:100%;border-collapse:collapse;font-size:13.5px}
.specs td{padding:8px 0;border-bottom:1px solid var(--linea);vertical-align:top}
.specs td:first-child{color:var(--n500);width:46%}
.specs td:last-child{font-weight:700;color:var(--n700);text-align:right}
.fchips{display:flex;flex-wrap:wrap;gap:6px}
.fchip{font-size:12px;font-weight:700;padding:4px 11px;border-radius:100px;background:var(--lima-soft);color:var(--lima-texto)}
.fchip.op{background:#fff4e0;color:#a76a00}
.fchip.no{background:#f1f3f5;color:#8a8a8a}
.clip{display:inline-block;background:var(--cielo);color:var(--azul);border-radius:5px;padding:1px 6px;font-size:10px;vertical-align:middle}
details summary::-webkit-details-marker{display:none}
.sinc{font-size:11px;font-weight:700;color:var(--lima-texto);background:var(--lima-soft);padding:4px 10px;border-radius:100px;white-space:nowrap}
.sinc.off{color:var(--rojo);background:var(--rojo-soft)}
.sinc.local{color:var(--n500);background:#f1f3f5}
.login{position:fixed;inset:0;z-index:100;background:var(--azul);display:flex;align-items:center;justify-content:center;padding:22px}
.tarjeta-login{background:#fff;border-radius:20px;padding:26px 22px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:13px}
.tarjeta-login h2{margin:0;font-size:19px;font-weight:900;color:var(--azul)}
.tarjeta-login .logo{height:40px;width:auto;align-self:flex-start;margin-bottom:2px}
.tarjeta-login p{margin:0}
.enlace{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--cielo);color:var(--azul);padding:12px 15px;border-radius:12px;font-weight:700;text-decoration:none;font-size:14px}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="hd">
      <img src="logo-rex.png" alt="Rex+" class="logo">
      <h1 id="titulo">Stock</h1>
      <span id="sincro" class="sinc"></span>
      <button class="btn btn-linea btn-sm" id="btn-instalar" hidden>Instalar</button>
    </div>
    <div class="busca">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" placeholder="Buscar" autocomplete="off">
    </div>
  </div>
  <div class="resumen"><div class="wrap"><div class="g" id="resumen"></div></div></div>
</header>

<main class="wrap" id="vista"></main>
<button class="fab" id="fab" aria-label="Agregar">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
</button>

<nav id="nav"></nav>
<div id="login"></div>
<div id="modal"></div>
<div id="toast"></div>

/* --------------------------------------------------------- almacenamiento */
const Store = (() => {
  let modo = "memoria";
  let db = null;
  const mem = new Map();

  function abrirIDB(){
    return new Promise((ok, fail) => {
      try{
        const r = indexedDB.open("inventario-equipos", 1);
        r.onupgradeneeded = () => r.result.createObjectStore("kv");
        r.onsuccess = () => ok(r.result);
        r.onerror = () => fail(r.error);
      }catch(e){ fail(e); }
    });
  }
  function tx(modoTx, fn){
    return new Promise((ok, fail) => {
      const t = db.transaction("kv", modoTx);
      const req = fn(t.objectStore("kv"));
      req.onsuccess = () => ok(req.result);
      req.onerror = () => fail(req.error);
    });
  }
  return {
    modo: () => modo,
    async iniciar(){
      try{ db = await abrirIDB(); modo = "idb"; return; }catch(e){}
      try{ localStorage.setItem("__t","1"); localStorage.removeItem("__t"); modo = "local"; return; }catch(e){}
      modo = "memoria";
    },
    async get(k){
      try{
        if(modo === "idb") return await tx("readonly", s => s.get(k));
        if(modo === "local"){ const v = localStorage.getItem(k); return v === null ? undefined : JSON.parse(v); }
        return mem.get(k);
      }catch(e){ return undefined; }
    },
    async set(k, v){
      try{
        if(modo === "idb"){ await tx("readwrite", s => s.put(v, k)); return true; }
        if(modo === "local"){ localStorage.setItem(k, JSON.stringify(v)); return true; }
        mem.set(k, v); return true;
      }catch(e){ return false; }
    },
    async del(k){
      try{
        if(modo === "idb"){ await tx("readwrite", s => s.delete(k)); return true; }
        if(modo === "local"){ localStorage.removeItem(k); return true; }
        mem.delete(k); return true;
      }catch(e){ return false; }
    }
  };
})();

function conexionValida(c){
  return !!(c && c.url && c.anonKey &&
    String(c.url).indexOf("TU-PROYECTO") === -1 &&
    String(c.anonKey).indexOf("TU-CLAVE") === -1);
}

/* nombres de columna que difieren entre la app y la base */
const MAPA = {
  modelos: { ventaUF: "venta_uf", arriendoUF: "arriendo_uf", proveedorId: "proveedor_id" },
  unidades: { proveedorId: "proveedor_id", facturaId: "factura_id" },   /* lote y creado viajan igual */
  facturas: { proveedorId: "proveedor_id" },
  cotizaciones: { usuarioId: "usuario_id", usuarioEmail: "usuario_email", envioUF: "envio_uf",
    instalacionUF: "instalacion_uf", totalUF: "total_uf" },
  proveedores: {}, movimientos: {}, fotos: {}
};
function aFila(tabla, o){
  const m = MAPA[tabla] || {}, f = {};
  for(const k in o){
    if(o[k] === undefined) continue;
    f[m[k] || k] = o[k] === "" && k !== "nombre" ? null : o[k];
  }
  return f;
}
function deFila(tabla, f){
  const m = MAPA[tabla] || {}, inv = {};
  for(const k in m) inv[m[k]] = k;
  const o = {};
  for(const k in f) o[inv[k] || k] = f[k] == null ? "" : f[k];
  if(tabla === "modelos"){
    o.minimo = Number(f.minimo) || 0;
    o.ventaUF = f.venta_uf == null ? null : Number(f.venta_uf);
    o.arriendoUF = f.arriendo_uf == null ? null : Number(f.arriendo_uf);
    o.ficha = f.ficha || {}; o.func = f.func || {}; o.fotos = f.fotos || [];
  }
  if(tabla === "unidades") o.costo = f.costo == null ? null : Number(f.costo);
  if(tabla === "facturas") o.monto = f.monto == null ? null : Number(f.monto);
  if(tabla === "cotizaciones"){
    o.lineas = f.lineas || []; o.uf = Number(f.uf) || UF_DEF;
    o.fecha = (f.fecha || f.creada || "").slice(0,10);
    o.totalUF = f.total_uf == null ? 0 : Number(f.total_uf);
    o.seguro = f.seguro !== false; o.iva = f.iva !== false;
  }
  return o;
}

const Sesion = { token: "", refresco: "", uid: "", email: "", nombre: "", rol: "" };

const API = {
  /* Tolera que peguen la URL con la cola del Data API: .../rest/v1/ */
  base: () => String(CFG.url || "").trim()
    .replace(/\/+$/, "")
    .replace(/\/(rest|auth|storage)\/v1$/, "")
    .replace(/\/+$/, ""),
  cabeceras(extra){
    return Object.assign({
      "apikey": CFG.anonKey,
      "Authorization": "Bearer " + (Sesion.token || CFG.anonKey),
      "Content-Type": "application/json"
    }, extra || {});
  },
  async entrar(email, clave){
    let r, j;
    try{
      r = await fetch(API.base() + "/auth/v1/token?grant_type=password", {
        method: "POST", headers: { "apikey": CFG.anonKey, "Content-Type": "application/json" },
        body: JSON.stringify({ email: email, password: clave })
      });
      j = await r.json();
    }catch(e){
      throw new Error("No se pudo conectar con el servidor. Revisa la URL y la clave en config.js.");
    }
    if(!r.ok){
      /* mensaje tal como lo devuelve Supabase, traducido cuando se reconoce */
      const crudo = j.error_description || j.msg || j.message || j.error || ("Error " + r.status);
      const cod = String(j.error_code || j.code || "");
      const t = (crudo + " " + cod).toLowerCase();
      let msg = crudo;
      if(t.indexOf("email not confirmed") >= 0 || t.indexOf("email_not_confirmed") >= 0)
        msg = "La cuenta existe pero el correo no está confirmado. Confírmalo en Authentication → Users.";
      else if(t.indexOf("invalid login") >= 0 || t.indexOf("invalid_credentials") >= 0)
        msg = "Correo o contraseña incorrectos. Revisa que el usuario exista en Authentication → Users.";
      else if(t.indexOf("signups not allowed") >= 0 || t.indexOf("email logins are disabled") >= 0 || t.indexOf("provider") >= 0)
        msg = "El acceso por correo está desactivado en Authentication → Sign In / Providers.";
      else if(r.status === 401 || t.indexOf("api key") >= 0 || t.indexOf("apikey") >= 0)
        msg = "La clave de config.js no es válida para este proyecto.";
      throw new Error(msg + "  [" + r.status + (cod ? " " + cod : "") + "]");
    }
    Sesion.token = j.access_token; Sesion.refresco = j.refresh_token;
    Sesion.uid = j.user && j.user.id; Sesion.email = j.user && j.user.email;
    await Store.set("sesion", { token: Sesion.token, refresco: Sesion.refresco, uid: Sesion.uid, email: Sesion.email });
    return j;
  },
  async renovar(){
    if(!Sesion.refresco) throw new Error("Sesión expirada");
    const r = await fetch(API.base() + "/auth/v1/token?grant_type=refresh_token", {
      method: "POST", headers: { "apikey": CFG.anonKey, "Content-Type": "application/json" },
      body: JSON.stringify({ refresh_token: Sesion.refresco })
    });
    const j = await r.json();
    if(!r.ok) throw new Error("Sesión expirada");
    Sesion.token = j.access_token; Sesion.refresco = j.refresh_token;
    await Store.set("sesion", { token: Sesion.token, refresco: Sesion.refresco, uid: Sesion.uid, email: Sesion.email });
  },
  async req(metodo, ruta, cuerpo, prefer, reintento){
    const r = await fetch(API.base() + "/rest/v1/" + ruta, {
      method: metodo,
      headers: API.cabeceras(prefer ? { "Prefer": prefer } : null),
      body: cuerpo ? JSON.stringify(cuerpo) : undefined
    });
    if(r.status === 401 && !reintento){ await API.renovar(); return API.req(metodo, ruta, cuerpo, prefer, true); }
    if(!r.ok){
      let msg = r.status + "";
      try{ const j = await r.json(); msg = j.message || j.hint || msg; }catch(e){}
      throw new Error(msg);
    }
    if(r.status === 204) return null;
    const txt = await r.text();
    return txt ? JSON.parse(txt) : null;
  },
  async perfil(){
    const p = await API.req("GET", "perfiles?select=rol,nombre,email&id=eq." + Sesion.uid);
    if(!p || !p.length) throw new Error("Entraste bien, pero tu usuario no tiene perfil. Ejecuta esquema.sql y vuelve a crear el usuario, o inserta la fila en la tabla perfiles.");
    Sesion.rol = p[0].rol; Sesion.nombre = p[0].nombre || p[0].email;
    return p[0];
  },
  async salir(){
    Sesion.token = ""; Sesion.refresco = ""; Sesion.rol = "";
    await Store.del("sesion"); await Store.del("cache");
  }
};

/* ------------------------------------------------------- capa de datos */
async function persistir(tabla, obj){
  if(!REMOTO) return guardar(CLAVE[tabla]);
  try{
    await API.req("POST", tabla + "?on_conflict=id", [aFila(tabla, obj)], "resolution=merge-duplicates,return=minimal");
    A.sinGuardar = false;
  }catch(e){ fallo(e, tabla); }
}
async function persistirLote(tabla, lista){
  if(!REMOTO) return guardar(CLAVE[tabla]);
  if(!lista.length) return;
  try{
    for(let i = 0; i < lista.length; i += 200){
      await API.req("POST", tabla + "?on_conflict=id", lista.slice(i, i + 200).map(o => aFila(tabla, o)), "resolution=merge-duplicates,return=minimal");
    }
    A.sinGuardar = false;
  }catch(e){ fallo(e, tabla); }
}
async function borrarFila(tabla, id){
  if(!REMOTO) return guardar(CLAVE[tabla]);
  try{ await API.req("DELETE", tabla + "?id=eq." + id); A.sinGuardar = false; }
  catch(e){ fallo(e, tabla); }
}

/* Deja a la vista el motivo real del fallo y, cuando se reconoce, cómo resolverlo. */
function fallo(e, tabla){
  A.sinGuardar = true;
  const m = String((e && e.message) || e);
  let pista = "";
  if(/could not find|schema cache|does not exist|column/i.test(m))
    pista = " Falta una columna en la base: vuelve a ejecutar esquema.sql en Supabase.";
  else if(/violates row-level security|permission denied|rls/i.test(m))
    pista = " Tu usuario no tiene permiso de escritura. Revisa que su rol sea admin.";
  else if(/foreign key|violates foreign/i.test(m))
    pista = " Hay una referencia que no existe, por ejemplo un modelo que no se alcanzó a crear.";
  else if(/duplicate key|unique/i.test(m))
    pista = " Ese registro ya existe en la base.";
  else if(/jwt|expired|401/i.test(m))
    pista = " La sesión caducó: cierra sesión y vuelve a entrar.";
  A.ultimoError = (tabla ? "al guardar " + tabla + ": " : "") + m + pista;
  avisar("No se pudo guardar. Revisa el aviso rojo arriba.");
  pintar();
}

/* PostgREST devuelve como máximo unos cientos o miles de filas por llamada.
   Esto recorre todas las páginas para no dejar equipos fuera del inventario. */
async function traerTodo(tabla, consulta){
  const partes = [];
  let desde = 0;
  for(let vuelta = 0; vuelta < 60; vuelta++){
    const r = await API.req("GET", tabla + "?" + consulta + "&limit=1000&offset=" + desde);
    const arr = r || [];
    partes.push(arr);
    if(!arr.length) break;
    desde += arr.length;
  }
  return [].concat.apply([], partes);
}

function comprimir(file, max, calidad){
  return new Promise((ok, fail) => {
    const fr = new FileReader();
    fr.onerror = () => fail(new Error("No se pudo leer el archivo"));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => fail(new Error("El archivo no es una imagen válida"));
      img.onload = () => {
        const e = Math.min(1, max / Math.max(img.width, img.height));
        const w = Math.max(1, Math.round(img.width * e)), h = Math.max(1, Math.round(img.height * e));
        const c = document.createElement("canvas");
        c.width = w; c.height = h;
        const x = c.getContext("2d");
        x.fillStyle = "#fff"; x.fillRect(0,0,w,h);
        x.drawImage(img, 0, 0, w, h);
        ok(c.toDataURL("image/jpeg", calidad));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

const MAX_ARCHIVO = 8 * 1024 * 1024;
const facturasDe = pid => A.facturas.filter(f => f.proveedorId === pid);

function leerDataURL(file){
  return new Promise((ok, fail) => {
    const fr = new FileReader();
    fr.onerror = () => fail(new Error("No se pudo leer el archivo"));
    fr.onload = () => ok(fr.result);
    fr.readAsDataURL(file);
  });
}

async function subirArchivo(fid, file){
  if(file.size > MAX_ARCHIVO) throw new Error("El archivo supera los 8 MB");
  const ext = (file.name.split(".").pop() || "bin").toLowerCase().slice(0, 5);
  const nombre = fid + "." + ext;
  if(REMOTO){
    const r = await fetch(API.base() + "/storage/v1/object/facturas/" + nombre, {
      method: "POST",
      headers: { "apikey": CFG.anonKey, "Authorization": "Bearer " + Sesion.token,
                 "x-upsert": "true", "Content-Type": file.type || "application/octet-stream" },
      body: file
    });
    if(!r.ok) throw new Error("No se pudo subir el archivo");
  } else {
    const data = await leerDataURL(file);
    await Store.set("arch:" + fid, { data: data, tipo: file.type, nombre: file.name });
  }
  return { archivo: nombre, tipo: file.type || "" };
}

async function borrarArchivo(f){
  if(!f || !f.archivo) return;
  if(REMOTO){
    try{
      await fetch(API.base() + "/storage/v1/object/facturas/" + f.archivo,
        { method: "DELETE", headers: API.cabeceras() });
    }catch(e){}
  } else await Store.del("arch:" + f.id);
}

async function abrirArchivo(f){
  if(!f.archivo) return avisar("Esta factura no tiene archivo adjunto");
  const ventana = window.open("", "_blank");
  try{
    if(REMOTO){
      const r = await fetch(API.base() + "/storage/v1/object/sign/facturas/" + f.archivo,
        { method: "POST", headers: API.cabeceras(), body: JSON.stringify({ expiresIn: 3600 }) });
      const j = await r.json();
      if(!r.ok || !j.signedURL) throw new Error("No se pudo abrir el archivo");
      if(ventana) ventana.location = API.base() + "/storage/v1" + j.signedURL;
    } else {
      const a = await Store.get("arch:" + f.id);
      if(!a) throw new Error("El archivo no está en este dispositivo");
      const bin = atob(a.data.split(",")[1]);
      const bytes = new Uint8Array(bin.length);
      for(let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      const url = URL.createObjectURL(new Blob([bytes], { type: a.tipo || "application/octet-stream" }));
      if(ventana) ventana.location = url;
      setTimeout(() => URL.revokeObjectURL(url), 60000);
    }
  }catch(e){
    if(ventana) ventana.close();
    avisar(e.message || "No se pudo abrir el archivo");
  }
}

/* ------------------------------------------------------------ cotizador */
const UF_DEF = TARIFAS.uf, F_SEGURO = TARIFAS.seguro, IVA = TARIFAS.iva;

/* El valor de la UF se toma del día desde mindicador.cl, que publica el dato
   oficial del Banco Central. No se escribe a mano. */
const FUENTES_UF = [
  { nombre: "mindicador.cl", url: "https://mindicador.cl/api/uf", leer: t => {
      const j = JSON.parse(t);
      if(!j || !j.serie || !j.serie[0]) return null;
      return { valor: Number(j.serie[0].valor), fecha: String(j.serie[0].fecha || "").slice(0, 10) };
    } }
];

async function actualizarUF(forzar){
  const c = await Store.get("uf");
  if(c && c.valor){ A.uf = c.valor; A.ufFecha = c.fecha; A.ufDia = c.dia || c.fecha; A.ufFuente = c.fuente; }
  if(!forzar && c && c.dia === hoy()) return A.uf;
  for(const f of FUENTES_UF){
    try{
      const r = await fetch(f.url, { cache: "no-store" });
      if(!r.ok) continue;
      const d = f.leer(await r.text());
      if(d && d.valor > 10000 && d.valor < 300000){
        A.uf = d.valor;
        A.ufFecha = d.fecha || hoy();
        A.ufDia = hoy();
        A.ufFuente = f.nombre;
        await Store.set("uf", { valor: A.uf, fecha: A.ufFecha, dia: A.ufDia, fuente: f.nombre });
        return A.uf;
      }
    }catch(e){ /* sin conexión o bloqueado por el navegador: probamos la siguiente */ }
  }
  return A.uf;
}
const tarifaEnvio = (cod, destino) => (TARIFAS.envios[cod] || {})[destino] || null;
const tarifaInstal = destino => TARIFAS.instal[destino] || null;
const uf2 = n => (Math.round(n * 10000) / 10000).toFixed(2);
/* La visita técnica de 2 horas vale lo mismo que una instalación en todas las
   ciudades de la planilla. La hora adicional viene neta y lleva el mismo margen. */
const MARGEN_SERVICIO = 1.4286;
const valorVisita = destino => { const i = tarifaInstal(destino); return i ? i.inst : 0; };
const valorHora = destino => { const i = tarifaInstal(destino); return i && i.hora ? i.hora * MARGEN_SERVICIO : 0; };

function cotVacia(){
  return { id: "", cliente: "", destino: "RM", modalidad: "Venta", fecha: hoy(), uf: A.uf || UF_DEF,
    seguro: true, iva: true, enviar: true, instalar: true, instalaciones: null,
    visitas: 0, horas: 0, lineas: [], envioManual: null };
}

function calcularCot(c){
  const r = { equipos: 0, envio: 0, instalacion: 0, unidades: 0, sinTarifa: [], lineas: [] };
  for(const l of c.lineas){
    const m = modelo(l.codigo);
    if(!m) continue;
    if(!esAdmin() && !activo(m)) continue;          // un modelo desactivado no se cotiza
    const base = c.modalidad === "Arriendo" ? (m.arriendoUF || 0) : (m.ventaUF || 0);
    const neto = base * (1 - (Number(l.desc) || 0) / 100);
    const sub = neto * l.cant;
    r.equipos += sub;
    r.unidades += l.cant;
    const t = c.enviar === false ? null : tarifaEnvio(l.codigo, c.destino);
    let env = 0;
    if(t){
      env = (t[1] / c.uf) * (c.seguro ? F_SEGURO : 1) * l.cant;
      r.envio += env;
    } else if(c.enviar !== false) r.sinTarifa.push(l.codigo);
    r.lineas.push({ l: l, m: m, neto: neto, sub: sub, env: env, sinTarifa: !t });
  }
  if(c.enviar === false) r.envio = 0;
  else if(c.envioManual !== null && c.envioManual !== "") r.envio = Number(c.envioManual);
  const ins = tarifaInstal(c.destino);
  r.nInst = c.instalar === false ? 0
    : (c.instalaciones === null || c.instalaciones === "" ? r.unidades : Math.max(0, Number(c.instalaciones)));
  r.instalacion = ins ? ins.inst * r.nInst : 0;
  r.nVisitas = Math.max(0, Number(c.visitas) || 0);
  r.nHoras = Math.max(0, Number(c.horas) || 0);
  r.visitas = r.nVisitas * valorVisita(c.destino) + r.nHoras * valorHora(c.destino);
  r.soloVisitas = !r.lineas.length && (r.nVisitas > 0 || r.nHoras > 0);
  r.hayAlgo = r.lineas.length > 0 || r.nVisitas > 0 || r.nHoras > 0;
  r.unico = r.envio + r.instalacion + r.visitas + (c.modalidad === "Arriendo" ? 0 : r.equipos);
  r.mensual = c.modalidad === "Arriendo" ? r.equipos : 0;
  r.ivaUnico = c.iva ? r.unico * IVA : 0;
  r.ivaMensual = c.iva ? r.mensual * IVA : 0;
  return r;
}

let jsPDFListo = null;
function cargarJsPDF(){
  if(jsPDFListo) return jsPDFListo;
  jsPDFListo = new Promise((ok, fail) => {
    if(window.jspdf && window.jspdf.jsPDF) return ok(window.jspdf.jsPDF);
    const s = document.createElement("script");
    s.src = "jspdf.umd.min.js";
    s.onload = () => (window.jspdf && window.jspdf.jsPDF) ? ok(window.jspdf.jsPDF) : fail(new Error("No se pudo cargar el generador de PDF"));
    s.onerror = () => fail(new Error("Falta el archivo jspdf.umd.min.js"));
    document.head.appendChild(s);
  });
  return jsPDFListo;
}

async function logoBase64(){

      const fr = new FileReader();
      fr.onerror = () => fail();
      fr.onload = () => ok(fr.result);
      fr.readAsDataURL(b);
    });
  }catch(e){ A.logo64 = null; }
  return A.logo64;
}

const folio = c => (c.id ? c.id.replace(/-/g, "").slice(0, 6).toUpperCase() : "BORRADOR");

async function cotizacionPDF(){
  if(!calcularCot(A.cot).hayAlgo) return avisar("Agrega equipos o visitas técnicas");
  if(!A.cot.id) await guardarCot();          // toda cotización emitida queda con folio
  const c = A.cot, r = calcularCot(c);
  let jsPDF;
  try{ jsPDF = await cargarJsPDF(); }catch(e){ return avisar(e.message); }
  avisar("Generando el PDF…");

  const AZUL = PDF_AZUL, CELESTE = PDF_CELESTE, LIMA = PDF_LIMA;
  const GRIS = PDF_GRIS, LINEA = PDF_LINEA, TEXTO = PDF_TEXTO;
  const doc = new jsPDF({ unit: "mm", format: "a4" });
  const W = 210, M = 16;
  let y = 0;

  await cabeceraRex(doc, W, r.soloVisitas ? "Cotización de servicio" : "Cotización",
    "N° " + folio(c) + "  ·  " + fechaLarga(c.fecha || hoy()), "");

  /* datos del encabezado */
  y = 42;
  const dato = (et, va) => {
    doc.setFont("helvetica", "normal"); doc.setFontSize(8.5); doc.setTextColor(...GRIS);
    doc.text(et.toUpperCase(), M, y);
    doc.setFont("helvetica", "bold"); doc.setFontSize(11); doc.setTextColor(...TEXTO);
    doc.text(String(va || "—"), M, y + 5.5);
    y += 13;
  };
  const izq = y;
  dato("Cliente", c.cliente);
  dato("Destino", c.destino);
  y = izq;
  const dato2 = (et, va) => {
    doc.setFont("helvetica", "normal"); doc.setFontSize(8.5); doc.setTextColor(...GRIS);
    doc.text(et.toUpperCase(), W / 2 + 6, y);
    doc.setFont("helvetica", "bold"); doc.setFontSize(11); doc.setTextColor(...TEXTO);
    doc.text(String(va || "—"), W / 2 + 6, y + 5.5);
    y += 13;
  };
  dato2("Modalidad", r.soloVisitas ? "Servicio en terreno" : c.modalidad);
  dato2("Ejecutivo", Sesion.nombre || Sesion.email || "—");
  y = izq + 26;

  /* tabla de equipos */
  const cols = [M, M + 12, W - 72, W - 46, W - M];
  doc.setFillColor(...LINEA);
  doc.rect(M - 3, y - 5, W - 2 * (M - 3), 8, "F");
  doc.setFont("helvetica", "bold"); doc.setFontSize(8.5); doc.setTextColor(...AZUL);
  doc.text("CANT.", cols[0], y);
  doc.text("DETALLE", cols[1], y);
  doc.text("UNITARIO UF", cols[3], y, { align: "right" });
  doc.text("TOTAL UF", cols[4], y, { align: "right" });
  y += 8;

  doc.setTextColor(...TEXTO);
  const filaDetalle = (cant, nombre, sub, unit, detalle) => {
    const nom = doc.splitTextToSize(nombre, W - 118);
    doc.setFont("helvetica", "bold"); doc.setFontSize(10); doc.setTextColor(...TEXTO);
    doc.text(String(cant), cols[0], y);
    doc.text(nom[0], cols[1], y);
    doc.setFont("helvetica", "normal");
    doc.text(uf2(unit), cols[3], y, { align: "right" });
    doc.setFont("helvetica", "bold");
    doc.text(uf2(sub), cols[4], y, { align: "right" });
    if(detalle){
      doc.setFont("helvetica", "normal"); doc.setFontSize(8.5); doc.setTextColor(...GRIS);
      doc.text(detalle, cols[1], y + 4.5);
      doc.setTextColor(...TEXTO);
    }
    y += 12;
    if(nom.length > 1){ doc.setFontSize(9); doc.text(nom[1], cols[1], y - 4); y += 3; }
    doc.setDrawColor(...LINEA); doc.line(M - 3, y - 5.5, W - M + 3, y - 5.5);
  };
  for(const x of r.lineas){
    const nombre = doc.splitTextToSize((x.m.nombre || x.m.modelo || x.m.codigo), W - 118);
    doc.setFont("helvetica", "bold"); doc.setFontSize(10);
    doc.text(String(x.l.cant), cols[0], y);
    doc.text(nombre[0], cols[1], y);
    doc.setFont("helvetica", "normal");
    doc.text(uf2(x.neto), cols[3], y, { align: "right" });
    doc.setFont("helvetica", "bold");
    doc.text(uf2(x.sub), cols[4], y, { align: "right" });
    doc.setFont("helvetica", "normal"); doc.setFontSize(8.5); doc.setTextColor(...GRIS);
    doc.text(x.m.codigo + (x.l.desc ? "  ·  descuento " + x.l.desc + "%" : "") +
      (c.modalidad === "Arriendo" ? "  ·  valor mensual" : ""), cols[1], y + 4.5);
    doc.setTextColor(...TEXTO);
    y += 12;
    if(nombre.length > 1){ doc.setFontSize(9); doc.text(nombre[1], cols[1], y - 4); y += 3; }
    doc.setDrawColor(...LINEA); doc.line(M - 3, y - 5.5, W - M + 3, y - 5.5);
  }

  if(r.nVisitas) filaDetalle(r.nVisitas, "Visita técnica en " + c.destino,
    r.nVisitas * valorVisita(c.destino), valorVisita(c.destino), "2 horas por visita");
  if(r.nHoras) filaDetalle(r.nHoras, "Horas adicionales de visita técnica",
    r.nHoras * valorHora(c.destino), valorHora(c.destino), "");

  /* totales */
  y += 4;
  const fila = (et, uf, negrita) => {
    doc.setFont("helvetica", negrita ? "bold" : "normal");
    doc.setFontSize(negrita ? 11 : 10);
    doc.setTextColor(...(negrita ? AZUL : TEXTO));
    let etq = String(et);                       // que nunca choque con la columna de UF
    const disp = (W - 46) - 94 - 26;            // se reserva el ancho de la cifra en UF
    if(doc.getTextWidth(etq) > disp){
      while(etq.length > 4 && doc.getTextWidth(etq + "…") > disp) etq = etq.slice(0, -1);
      etq += "…";
    }
    doc.text(etq, 94, y, { align: "left" });
    doc.text(uf2(uf) + " UF", W - 46, y, { align: "right" });
    doc.text(clp(uf * c.uf), W - M, y, { align: "right" });
    y += 7;
  };
  if(r.lineas.length){
    fila(c.modalidad === "Arriendo" ? "Arriendo mensual" : "Equipos", r.equipos);
    fila(c.enviar === false ? "Envío no incluido" : "Envío" + (c.seguro ? " con seguro" : ""), r.envio);
    fila(r.nInst ? "Instalación (" + r.nInst + ")" : "Instalación no incluida", r.instalacion);
  }
  if(r.visitas) fila("Visitas técnicas" + (r.nHoras ? " y horas extra" : ""), r.visitas);
  doc.setDrawColor(...CELESTE); doc.setLineWidth(0.5);
  doc.line(94, y - 4.5, W - M, y - 4.5); doc.setLineWidth(0.2);
  y += 1;
  if(c.modalidad === "Arriendo"){
    fila("Pago único", r.unico, true);
    if(c.iva) fila("IVA 19% del pago único", r.ivaUnico);
    fila("Mensual neto", r.mensual, true);
    if(c.iva) fila("Mensual con IVA", r.mensual + r.ivaMensual, true);
  } else {
    fila("Total neto", r.unico, true);
    if(c.iva){
      fila("IVA 19%", r.ivaUnico);
      fila("Total con IVA", r.unico + r.ivaUnico, true);
    }
  }

  /* notas y pie */
  y += 6;
  doc.setFont("helvetica", "normal"); doc.setFontSize(8.5); doc.setTextColor(...GRIS);
  const notas = [
    "Valores expresados en UF. El monto en pesos se calcula con la UF de " +
      fechaLarga(A.ufFecha || c.fecha || hoy()) + " (" + clp(c.uf) + ")" +
      (A.ufFuente ? ", según " + A.ufFuente + "." : "."),
    r.nInst ? "La instalación se cotiza por equipo instalado, salvo que se indique otra cantidad." : "",
    r.nVisitas ? "Cada visita técnica considera 2 horas en terreno; el tiempo adicional se cobra por hora." : "",
    (r.lineas.length && c.enviar === false) ? "El envío no está incluido: el retiro queda por cuenta del cliente." : "",
    r.lineas.length ? "Precios sujetos a disponibilidad de stock al momento de la aceptación." : "",
    "Validez de la oferta: 15 días corridos desde la fecha indicada."
  ].filter(Boolean);
  for(const n of notas){
    for(const linea of doc.splitTextToSize(n, W - 2 * M)){ doc.text(linea, M, y); y += 4.2; }
  }

  pieRex(doc, W, 297, "Rex+  ·  Tecnología de asistencia",
    "Cotización N° " + folio(c) + "  ·  " + fechaLarga(c.fecha || hoy()));

  const nombre = "cotizacion-" + folio(c) +
    (c.cliente ? "-" + c.cliente.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-zA-Z0-9]+/g, "-").toLowerCase().slice(0, 24) : "") +
    "-" + (c.fecha || hoy()) + ".pdf";
  try{ doc.save(nombre); avisar("PDF descargado"); }
  catch(e){
    try{ window.open(doc.output("bloburl"), "_blank"); }
    catch(e2){ avisar("No se pudo generar el PDF"); }
  }
}

function leerCot(){
  const c = A.cot;
  const v = id => { const e = document.getElementById(id); return e ? e.value : null; };
  if(v("c-cliente") !== null) c.cliente = v("c-cliente");
  if(v("c-destino") !== null) c.destino = v("c-destino");
  if(v("c-fecha") !== null) c.fecha = v("c-fecha") || hoy();
  if(v("c-modalidad") !== null) c.modalidad = v("c-modalidad");
  if(v("c-envio") !== null) c.envioManual = v("c-envio") === "" ? null : Number(v("c-envio"));
  if(v("c-inst") !== null) c.instalaciones = v("c-inst") === "" ? null : Math.max(0, Number(v("c-inst")));
  if(v("c-visitas") !== null) c.visitas = Math.max(0, Number(v("c-visitas")) || 0);
  if(v("c-horas") !== null) c.horas = Math.max(0, Number(v("c-horas")) || 0);
}

function modalLinea(idx){
  const c = A.cot;
  const l = (idx === null || idx === undefined) ? null : c.lineas[idx];
  ctx = { tipo: "linea", idx: (l ? idx : null) };
  abrirModal(
    '<label class="f"><span>Equipo</span><select class="inp" id="l-codigo">' +
      modelosVisibles().filter(m => m.ventaUF || m.arriendoUF).map(m =>
        '<option value="' + esc(m.codigo) + '"' + (l && l.codigo === m.codigo ? " selected" : "") + '>' +
        esc(m.codigo) + " · " + esc(m.nombre || m.modelo || "") + (activo(m) ? "" : "  (inactivo)") +
        '</option>').join("") + '</select></label>' +
    '<div class="f2"><label class="f"><span>Cantidad</span><input class="inp" id="l-cant" type="number" min="1" value="' + (l ? l.cant : 1) + '"></label>' +
    '<label class="f"><span>Descuento %</span><input class="inp" id="l-desc" type="number" min="0" max="100" value="' + (l ? (l.desc || 0) : 0) + '"></label></div>' +
    '<p class="mini" style="margin:0">Precio ' + (c.modalidad === "Arriendo" ? "de arriendo mensual" : "de venta") + ' según el catálogo.</p>' +
    '<button class="btn btn-celeste btn-w" data-accion="guardar-linea">' + (l ? "Guardar cambios" : "Agregar a la cotización") + '</button>' +
    (l ? '<button class="btn btn-rojo btn-w" data-accion="quitar-linea-modal">Quitar de la cotización</button>' : ""),
    l ? "Editar línea de la cotización" : "Agregar a la cotización");
}

function textoCot(){
  const c = A.cot, r = calcularCot(c);
  const L = [];
  L.push("COTIZACIÓN N° " + folio(c) + (c.cliente ? " · " + c.cliente : ""));
  L.push("Fecha: " + fechaLarga(c.fecha || hoy()));
  L.push("Destino: " + c.destino + " · " + c.modalidad);
  L.push("");
  r.lineas.forEach(x => L.push("- " + x.l.cant + " × " + (x.m.nombre || x.m.modelo || x.m.codigo) +
    ": " + uf2(x.sub) + " UF (" + clp(x.sub * c.uf) + ")"));
  if(r.nVisitas) L.push("- " + r.nVisitas + " × visita técnica de 2 horas en " + c.destino +
    ": " + uf2(r.nVisitas * valorVisita(c.destino)) + " UF");
  if(r.nHoras) L.push("- " + r.nHoras + " × hora adicional: " + uf2(r.nHoras * valorHora(c.destino)) + " UF");
  L.push("");
  if(r.lineas.length){
    L.push((c.modalidad === "Arriendo" ? "Arriendo mensual" : "Equipos") + ": " + uf2(r.equipos) + " UF");
    L.push(c.enviar === false ? "Envío: no incluido"
      : "Envío" + (c.seguro ? " con seguro" : "") + ": " + uf2(r.envio) + " UF");
  }
  if(r.visitas) L.push("Visitas técnicas: " + uf2(r.visitas) + " UF");
  if(r.nInst) L.push("Instalación (" + r.nInst + (r.nInst === 1 ? " instalación" : " instalaciones") + "): " + uf2(r.instalacion) + " UF");
  else if(r.lineas.length) L.push("Instalación: no incluida");
  if(c.modalidad === "Arriendo"){
    L.push("Pago único: " + uf2(r.unico) + " UF = " + clp(r.unico * c.uf));
    L.push("Mensual neto: " + uf2(r.mensual) + " UF = " + clp(r.mensual * c.uf));
    if(c.iva) L.push("Mensual con IVA: " + clp((r.mensual + r.ivaMensual) * c.uf));
  } else {
    L.push("Total neto: " + uf2(r.unico) + " UF = " + clp(r.unico * c.uf));
    if(c.iva) L.push("Total con IVA: " + clp((r.unico + r.ivaUnico) * c.uf));
  }
  L.push("");
  L.push("UF usada: " + nf.format(c.uf) + (A.ufFecha ? " (" + fechaCorta(A.ufFecha) + ")" : ""));
  return L.join("\n");
}

async function copiarCot(){
  const txt = textoCot();
  try{
    await navigator.clipboard.writeText(txt);
    avisar("Resumen copiado");
  }catch(e){
    abrirModal('<p class="mini" style="margin:0">Copia este texto y pégalo donde lo necesites:</p>' +
      '<textarea class="inp" rows="14">' + esc(txt) + '</textarea>', "Resumen de la cotización");
  }
}

async function guardarCot(){
  leerCot();
  const c = A.cot, r = calcularCot(c);
  if(!calcularCot(c).hayAlgo) return avisar("Agrega equipos o visitas técnicas");
  if(!c.id) c.id = uuid();
  const fila = { id: c.id, usuarioId: Sesion.uid || "local", usuarioEmail: Sesion.email || "local",
    cliente: c.cliente, destino: c.destino, modalidad: c.modalidad, fecha: c.fecha || hoy(), uf: c.uf, seguro: c.seguro,
    iva: c.iva, enviar: c.enviar !== false, instalar: c.instalar !== false, instalaciones: r.nInst,
    visitas: r.nVisitas, horas: r.nHoras,
    lineas: c.lineas, envioUF: r.envio, instalacionUF: r.instalacion,
    totalUF: c.modalidad === "Arriendo" ? r.mensual : r.unico,
    creada: new Date().toISOString() };
  const ya = A.cotizaciones.find(x => x.id === c.id);
  if(ya) Object.assign(ya, fila); else A.cotizaciones.unshift(fila);
  await persistir("cotizaciones", fila);
  await Store.set("cot", c);
  pintar(); avisar("Cotización guardada");
}

function abrirCot(id){
  const x = A.cotizaciones.find(y => y.id === id);
  if(!x) return;
  A.cot = { id: x.id, cliente: x.cliente, destino: x.destino, modalidad: x.modalidad,
    fecha: (x.fecha || x.creada || "").slice(0,10) || hoy(),
    uf: Number(x.uf) || A.uf || UF_DEF, seguro: !!x.seguro, iva: !!x.iva,
    visitas: Number(x.visitas) || 0, horas: Number(x.horas) || 0,
    enviar: x.enviar !== false, instalar: x.instalar !== false, instalaciones: (x.instalaciones === null || x.instalaciones === undefined) ? null : Number(x.instalaciones),
    lineas: (x.lineas || []).map(l => ({ codigo: l.codigo, cant: Number(l.cant) || 1, desc: Number(l.desc) || 0 })),
    envioManual: null };
  A.vista = "cotiza";
  pintar();
}

/* ------------------------------------------------------------- reportes */
const REPORTES = [
  ["modelo", "Por modelo"], ["dispo", "Disponibilidad"], ["cliente", "Por cliente"],
  ["proveedor", "Por proveedor"], ["vendedor", "Por vendedor"], ["equipo", "Por equipo"],
  ["movs", "Movimientos"]
];
const PERIODOS = [["todo","Todo"], ["30","30 días"], ["90","90 días"], ["anio","Este año"]];
const USA_PERIODO = { cliente: 1, proveedor: 1, vendedor: 1, movs: 1 };

function desdePeriodo(p){
  const h = new Date();
  if(p === "30") return new Date(h.getTime() - 30 * 86400000).toISOString().slice(0,10);
  if(p === "90") return new Date(h.getTime() - 90 * 86400000).toISOString().slice(0,10);
  if(p === "anio") return h.getFullYear() + "-01-01";
  return "";
}
const enRango = (f, desde) => !desde || (f && String(f).slice(0,10) >= desde);
const sitDe = (us, s) => us.filter(u => u.situacion === s).length;

/* ------------------------------------------------- filtros del reporte */
function filtroActivo(){
  const r = A.rep;
  return !!(r.desde || r.hasta || (r.situacion && r.situacion !== "Todas") ||
    r.proveedorId || (r.categoria && r.categoria !== "Todas"));
}

function rangoFechas(){
  return { desde: A.rep.desde || desdePeriodo(A.rep.periodo), hasta: A.rep.hasta || "" };
}

/* La fecha que se considera es la de entrega y, si no tiene, la de ingreso. */
function unidadesFiltradas(){
  const r = A.rep, { desde, hasta } = rangoFechas();
  return A.unidades.filter(u => {
    if(r.situacion && r.situacion !== "Todas" && u.situacion !== r.situacion) return false;
    if(r.proveedorId && u.proveedorId !== r.proveedorId) return false;
    if(r.categoria && r.categoria !== "Todas"){
      const m = modelo(u.codigo);
      if(!m || m.categoria !== r.categoria) return false;
    }
    if(desde || hasta){
      const f = String(u.entrega || u.ingreso || "").slice(0, 10);
      if(!f) return false;
      if(desde && f < desde) return false;
      if(hasta && f > hasta) return false;
    }
    return true;
  });
}

const colOculta = nombre => !!((A.rep.cols[A.rep.tipo] || {})[nombre]);
const filaElegida = clave => !!((A.rep.sel[A.rep.tipo] || {})[clave]);
const haySeleccion = () => Object.values(A.rep.sel[A.rep.tipo] || {}).some(Boolean);

/* Devuelve solo las columnas visibles y, si hay filas marcadas, solo esas. */
function datosExport(R){
  const idx = R.cab.map((c, i) => i).filter(i => !colOculta(R.cab[i]));
  const sel = haySeleccion();
  const cab = idx.map(i => R.cab[i]);
  const filas = [];
  R.csv.forEach((f, i) => {
    if(sel && !filaElegida(R.filas[i] ? R.filas[i].clave : i)) return;
    filas.push(idx.map(j => f[j]));
  });
  return { cab: cab, filas: filas };
}

function generarReporte(){
  const tipo = A.rep.tipo;
  const { desde, hasta } = rangoFechas();
  const q = A.q.toLowerCase();
  const US = unidadesFiltradas();
  const unidadesDeF = cod => US.filter(u => u.codigo === cod);
  const sitF = (us, s) => us.filter(u => u.situacion === s).length;
  const R = { resumen: [], filas: [], cab: [], csv: [], nombre: "reporte-" + tipo, nota: "" };

  if(tipo === "modelo"){
    const ms = A.modelos.slice().sort((a, b) => unidadesDeF(b.codigo).length - unidadesDeF(a.codigo).length);
    let valor = 0;
    for(const m of ms){
      const us = unidadesDeF(m.codigo);
      const disp = sitF(us, "Disponible");
      valor += disp * (m.ventaUF || 0);
      if(!us.length && !q) continue;
      R.filas.push({ clave: m.codigo, t: m.nombre || m.modelo || m.codigo,
        s: esc(m.codigo) + " · " + disp + " disp · " + sitF(us, "Reservado") + " reserv · " +
           sitF(us, "Entregado") + " entregados" + (sitF(us, "En revisión") ? " · " + sitF(us, "En revisión") + " en revisión" : ""),
        v: us.length, vs: "equipos" });
      R.csv.push([m.codigo, m.modelo, m.categoria, us.length, disp, sitF(us, "Reservado"),
        sitF(us, "Entregado"), sitF(us, "En revisión"), sitF(us, "Baja"), m.minimo || 0,
        m.ventaUF || "", (disp * (m.ventaUF || 0)).toFixed(2)]);
    }
    R.cab = ["codigo","modelo","categoria","total","disponibles","reservados","entregados","en_revision","baja","minimo","venta_uf","valor_stock_uf"];
    R.resumen = [["Equipos", nf.format(US.length)], ["Modelos con equipos", nf.format(R.filas.length)],
      ["Valor del stock", uf2(valor) + " UF"]];
  }

  if(tipo === "dispo"){
    const ms = A.modelos.map(m => {
      const us = unidadesDeF(m.codigo);
      const d = sitF(us, "Disponible"), min = m.minimo || 0;
      return { m: m, us: us, d: d, min: min, falta: Math.max(0, min - d) };
    }).sort((a, b) => (b.falta - a.falta) || (a.d - b.d));
    let bajos = 0, sinStock = 0;
    for(const x of ms){
      if(x.falta) bajos++;
      if(!x.d) sinStock++;
      if(!x.d && !x.min && !x.us.length && !q) continue;
      const p = proveedor(x.m.proveedorId);
      R.filas.push({ clave: x.m.codigo, t: x.m.nombre || x.m.modelo || x.m.codigo,
        s: esc(x.m.codigo) + " · mínimo " + x.min + (x.falta ? " · faltan " + x.falta : "") +
           (!x.d && p && p.plazo ? " · reposición " + p.plazo + " días" : ""),
        v: x.d, vs: "disp.", alerta: x.falta > 0 });
      R.csv.push([x.m.codigo, x.m.nombre, x.d, sitF(x.us, "Reservado"), x.min, x.falta,
        p ? p.nombre : "", p && p.plazo ? p.plazo : ""]);
    }
    R.cab = ["codigo","descripcion","disponibles","reservados","minimo","faltan","proveedor","plazo_dias"];
    R.resumen = [["Disponibles", nf.format(US.filter(u => u.situacion === "Disponible").length)],
      ["Bajo mínimo", nf.format(bajos)], ["Sin stock", nf.format(sinStock)]];
  }

  if(tipo === "cliente"){
    const g = {};
    for(const u of US){ if(!u.cliente) continue; (g[u.cliente.trim()] = g[u.cliente.trim()] || []).push(u); }
    const claves = Object.keys(g).sort((a, b) => g[b].length - g[a].length);
    for(const k of claves){
      const us = g[k];
      const fechas = us.map(u => u.entrega).filter(Boolean).sort();
      const mods = [...new Set(us.map(u => u.codigo))];
      R.filas.push({ clave: k, t: k, s: mods.length + (mods.length === 1 ? " modelo" : " modelos") +
        (fechas.length ? " · última entrega " + fechaCorta(fechas[fechas.length - 1]) : " · sin fecha de entrega"),
        v: us.length, vs: "equipos" });
      R.csv.push([k, us.length, mods.join(" "), fechas[0] || "", fechas[fechas.length - 1] || "",
        us.map(u => u.serie).join(" ")]);
    }
    R.cab = ["cliente","equipos","modelos","primera_entrega","ultima_entrega","series"];
    const tot = claves.reduce((a, k) => a + g[k].length, 0);
    R.resumen = [["Clientes", nf.format(claves.length)], ["Equipos en clientes", nf.format(tot)],
      ["Promedio", claves.length ? (tot / claves.length).toFixed(1) : "0"]];
  }

  if(tipo === "proveedor"){
    for(const p of A.proveedores){
      if(A.rep.proveedorId && p.id !== A.rep.proveedorId) continue;
      const us = US.filter(u => u.proveedorId === p.id);
      const fs = facturasDe(p.id).filter(f => (!desde || String(f.fecha || "") >= desde) && (!hasta || String(f.fecha || "") <= hasta));
      const inv = us.reduce((a, u) => a + (Number(u.costo) || 0), 0);
      const fact = fs.reduce((a, f) => a + (f.moneda === "CLP" ? (Number(f.monto) || 0) : 0), 0);
      R.filas.push({ clave: p.nombre, t: p.nombre,
        s: esc(p.origen || "Local") + (p.plazo ? " · " + p.plazo + " días" : "") +
           " · " + fs.length + " facturas" + (inv ? " · " + clp(inv) : ""),
        v: us.length, vs: "equipos" });
      R.csv.push([p.nombre, p.origen || "", p.plazo || "", us.length,
        us.filter(u => u.situacion === "Disponible").length, us.filter(u => u.situacion === "Entregado").length,
        inv, fs.length, fact, p.email || "", p.telefono || ""]);
    }
    R.cab = ["proveedor","origen","plazo_dias","equipos","disponibles","entregados","inversion_clp","facturas","facturado_clp","correo","telefono"];
    R.resumen = [["Proveedores", nf.format(R.filas.length)],
      ["Equipos comprados", nf.format(R.filas.reduce((a, f) => a + f.v, 0))],
      ["Facturas", nf.format(A.facturas.length)]];
  }

  if(tipo === "vendedor"){
    const g = {};
    const tocar = k => (g[k] = g[k] || { equipos: [], cots: [] });
    for(const u of US){ if(u.vendedor) tocar(u.vendedor.trim()).equipos.push(u); }
    for(const c of A.cotizaciones){
      const f = String(c.fecha || c.creada || "").slice(0, 10);
      if(desde && f && f < desde) continue;
      if(hasta && f && f > hasta) continue;
      tocar((c.usuarioEmail || "sin identificar").trim()).cots.push(c);
    }
    const claves = Object.keys(g).sort((a, b) =>
      (g[b].equipos.length + g[b].cots.length) - (g[a].equipos.length + g[a].cots.length));
    for(const k of claves){
      const x = g[k];
      const ufc = x.cots.reduce((a, c) => a + (Number(c.totalUF) || 0), 0);
      const cli = [...new Set(x.equipos.map(u => u.cliente).filter(Boolean))];
      const fechas = x.equipos.map(u => u.entrega).filter(Boolean).sort();
      R.filas.push({ clave: k, t: k,
        s: x.equipos.length + " equipos · " + cli.length + " clientes · " + x.cots.length + " cotizaciones" +
           (ufc ? " por " + uf2(ufc) + " UF" : ""),
        v: x.equipos.length + x.cots.length, vs: "registros" });
      R.csv.push([k, x.equipos.length, cli.length, fechas[fechas.length - 1] || "", x.cots.length, ufc.toFixed(2)]);
    }
    R.cab = ["vendedor","equipos_entregados","clientes","ultima_entrega","cotizaciones","cotizado_uf"];
    R.resumen = [["Vendedores", nf.format(claves.length)],
      ["Equipos con vendedor", nf.format(US.filter(u => u.vendedor).length)],
      ["Cotizaciones", nf.format(A.cotizaciones.length)]];
    R.nota = "El vendedor se asigna en la ficha de cada equipo. Las cotizaciones se agrupan por la cuenta que las creó.";
  }

  if(tipo === "equipo"){
    const us = (q ? US.filter(u =>
      [u.serie, u.cliente, u.oc, u.codigo].filter(Boolean).join(" ").toLowerCase().includes(q)) : US).slice(0, 300);
    for(const u of us){
      const m = modelo(u.codigo), p = proveedor(u.proveedorId), f = factura(u.facturaId);
      R.filas.push({ clave: u.serie, t: u.serie,
        s: (m ? esc(m.nombre || m.modelo || u.codigo) : esc(u.codigo)) +
           (p ? " · " + esc(p.nombre) : "") + (f && f.numero ? " · factura " + esc(f.numero) : "") +
           (u.cliente ? " · " + esc(u.cliente) : "") + (u.vendedor ? " · vendió " + esc(u.vendedor) : "") +
           (u.instalador ? " · instaló " + esc(u.instalador) : "") +
           (u.ingreso ? " · ingresó " + fechaCorta(u.ingreso) : "") + (u.entrega ? " · entregó " + fechaCorta(u.entrega) : ""),
        v: u.situacion, vs: "", id: u.id });
      R.csv.push([u.serie, u.codigo, m ? m.modelo : "", u.situacion, u.estado, u.cliente || "", u.vendedor || "",
        u.instalador || "", p ? p.nombre : "", f ? f.numero : "", u.oc || "", u.costo == null ? "" : u.costo,
        u.ingreso || "", u.entrega || "", u.ubicacion || ""]);
    }
    R.cab = ["serie","codigo","modelo","situacion","estado","cliente","vendedor","instalador","proveedor","factura","orden_compra","costo_clp","ingreso","entrega","ubicacion"];
    R.resumen = [["Equipos", nf.format(US.length)], ["En pantalla", nf.format(R.filas.length)],
      ["Con cliente", nf.format(US.filter(u => u.cliente).length)]];
    if(!q && US.length > 300) R.nota = "Se muestran los primeros 300. Usa el buscador o los filtros para acotar.";
  }

  if(tipo === "movs"){
    for(const m of A.movs){
      const f = String(m.ts || "").slice(0, 10);
      if(desde && f < desde) continue;
      if(hasta && f > hasta) continue;
      R.filas.push({ clave: m.id, t: m.texto, s: (m.serie ? esc(m.serie) + " · " : "") +
        new Date(m.ts).toLocaleString("es-CL", { day:"2-digit", month:"short", hour:"2-digit", minute:"2-digit" }) +
        (m.usuario && m.usuario !== "local" ? " · " + esc(m.usuario) : ""), v: "", vs: "" });
      R.csv.push([m.ts, m.texto, m.serie || "", m.usuario || ""]);
    }
    R.cab = ["fecha","movimiento","serie","usuario"];
    R.resumen = [["Movimientos", nf.format(R.filas.length)]];
  }

  if(q && tipo !== "equipo"){
    const idx = [];
    R.filas = R.filas.filter((f, i) => {
      const ok = (f.t + " " + f.s).toLowerCase().includes(q);
      if(ok) idx.push(i);
      return ok;
    });
    R.csv = idx.map(i => R.csv[i]);
  }
  return R;
}

/* --------------------------------------------- documentos PDF con marca Rex+ */
const PDF_AZUL = [10, 92, 133], PDF_CELESTE = [0, 186, 255], PDF_LIMA = [190, 218, 105];
const PDF_GRIS = [104, 128, 141], PDF_LINEA = [226, 236, 242], PDF_TEXTO = [44, 62, 74];

async function cabeceraRex(doc, W, titulo, der1, der2){
  doc.setFillColor(...PDF_AZUL);
  doc.rect(0, 0, W, 30, "F");
  const l64 = await logoBase64();
  if(l64){
    doc.setFillColor(255, 255, 255);
    doc.roundedRect(12, 6, 44, 18, 2.5, 2.5, "F");
    try{ doc.addImage(l64, "PNG", 15, 9.5, 38, 11); }catch(e){}
  } else {
    doc.setTextColor(255, 255, 255); doc.setFont("helvetica", "bold"); doc.setFontSize(18);
    doc.text("Rex+", 16, 19);
  }
  doc.setTextColor(255, 255, 255);
  doc.setFont("helvetica", "bold"); doc.setFontSize(15);
  doc.text(titulo, W - 16, der2 ? 15 : 19, { align: "right" });
  doc.setFont("helvetica", "normal"); doc.setFontSize(9);
  if(der1) doc.text(der1, W - 16, der2 ? 22 : 25, { align: "right" });
  if(der2) doc.text(der2, W - 16, 27, { align: "right" });
}

function pieRex(doc, W, H, izq, der){
  doc.setFillColor(...PDF_LIMA);
  doc.rect(0, H - 10, W, 10, "F");
  doc.setTextColor(...PDF_AZUL); doc.setFont("helvetica", "bold"); doc.setFontSize(8.5);
  doc.text(izq, 16, H - 3.5);
  doc.setFont("helvetica", "normal");
  doc.text(der, W - 16, H - 3.5, { align: "right" });
}

/* ------------------------------------------------------ reporte en PDF */
async function reportePDF(){
  try{ await reportePDFInterno(); }
  catch(e){
    console.error(e);
    A.ultimoError = "Al generar el PDF del reporte: " + ((e && e.message) || e);
    A.sinGuardar = true;
    pintar();
    avisar("No se pudo generar el PDF. Revisa el aviso rojo.");
  }
}

async function reportePDFInterno(){
  const Rfull = generarReporte();
  const D = datosExport(Rfull);
  const R = { cab: D.cab, csv: D.filas, resumen: Rfull.resumen, nota: Rfull.nota, nombre: Rfull.nombre };
  if(!R.csv.length) return avisar(haySeleccion() ? "No hay filas seleccionadas" : "Este reporte no tiene datos");
  let jsPDF;
  try{ jsPDF = await cargarJsPDF(); }catch(e){ return avisar(e.message); }
  avisar("Generando el PDF…");

  const ancho = R.cab.length > 6;
  const doc = new jsPDF({ unit: "mm", format: "a4", orientation: ancho ? "landscape" : "portrait" });
  const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight();
  const M = 16, util = W - 2 * M;
  const nombreRep = (REPORTES.find(x => x[0] === A.rep.tipo) || ["", "Reporte"])[1];
  await cabeceraRex(doc, W, "Reporte · " + nombreRep, fechaLarga(hoy()),
    [textoPeriodo(), A.q ? 'Buscado: "' + A.q + '"' : "",
     haySeleccion() ? "Selección de " + R.csv.length + " filas" : ""].filter(Boolean).join("   ·   "));

  /* resumen */
  let y = 42;
  doc.setDrawColor(...PDF_LINEA);
  doc.setFillColor(248, 251, 253);
  doc.roundedRect(M - 4, y - 8, util + 8, 14, 2, 2, "F");
  let x = M;
  for(const [k, v] of R.resumen){
    doc.setFont("helvetica", "normal"); doc.setFontSize(8); doc.setTextColor(...PDF_GRIS);
    doc.text(String(k).toUpperCase(), x, y - 3);
    doc.setFont("helvetica", "bold"); doc.setFontSize(11); doc.setTextColor(...PDF_AZUL);
    doc.text(String(v), x, y + 2.5);
    x += util / Math.max(1, R.resumen.length);
  }
  y += 16;

  /* anchos de columna: lo que mide de verdad el texto más largo de cada una */
  const muestra = R.csv.slice(0, 200);
  doc.setFont("helvetica", "normal"); doc.setFontSize(8);
  const necesita = R.cab.map((c, i) => {
    let contenido = 0;
    for(const f of muestra) contenido = Math.max(contenido, doc.getTextWidth(String(f[i] == null ? "" : f[i])));
    if(contenido === 0) return 14;                 // columna vacía: mínimo, el título se recorta
    const titulo = doc.getTextWidth(String(c).replace(/_/g, " ").toUpperCase()) * 0.95;
    return Math.min(62, Math.max(contenido, Math.min(titulo, 20)) + 4);
  });
  const pedido = necesita.reduce((a, b) => a + b, 0);
  let anchos;
  if(pedido <= util){                              // cabe todo: se reparte el sobrante
    const extra = (util - pedido) / necesita.length;
    anchos = necesita.map(w => w + extra);
  } else {                                         // no cabe: se achican las más anchas
    anchos = necesita.map(w => Math.max(12, w * util / pedido));
    let exceso = anchos.reduce((a, b) => a + b, 0) - util;
    while(exceso > 0.5){
      const grandes = anchos.map((a, i) => [a, i]).filter(x => x[0] > 16);
      if(!grandes.length) break;
      for(const [, i] of grandes) anchos[i] -= exceso / grandes.length;
      exceso = anchos.reduce((a, b) => a + b, 0) - util;
    }
  }
  const numerica = R.cab.map((c, i) =>
    muestra.length > 0 && muestra.every(f => f[i] === "" || f[i] == null || !isNaN(Number(f[i]))));
  const xs = []; let acc = M;
  for(const a of anchos){ xs.push(acc); acc += a; }

  /* recorta usando el ancho real del texto en la fuente actual */
  const recortar = (t, ancho) => {
    t = String(t);
    if(doc.getTextWidth(t) <= ancho) return t;
    while(t.length > 1 && doc.getTextWidth(t + "…") > ancho) t = t.slice(0, -1);
    return t + "…";
  };
  const encabezadoTabla = () => {
    doc.setFillColor(...PDF_LINEA);
    doc.rect(M - 3, y - 5, util + 6, 7.5, "F");
    doc.setFont("helvetica", "bold"); doc.setFontSize(7.5); doc.setTextColor(...PDF_AZUL);
    R.cab.forEach((c, i) => {
      const t = recortar(String(c).replace(/_/g, " ").toUpperCase(), anchos[i] - 2.5);
      doc.text(t, numerica[i] ? xs[i] + anchos[i] - 2.5 : xs[i], y, { align: numerica[i] ? "right" : "left" });
    });
    y += 7;
  };
  encabezadoTabla();

  doc.setTextColor(...PDF_TEXTO);
  let fila = 0;
  for(const f of R.csv){
    if(y > H - 18){
      pieRex(doc, W, H, "Rex+  ·  " + nombreRep, "Página " + doc.getNumberOfPages());
      doc.addPage();
      y = 20;
      encabezadoTabla();
      doc.setTextColor(...PDF_TEXTO);
    }
    if(fila % 2 === 1){
      doc.setFillColor(250, 252, 254);
      doc.rect(M - 3, y - 4, util + 6, 6, "F");
    }
    doc.setFont("helvetica", "normal"); doc.setFontSize(8);
    R.cab.forEach((c, i) => {
      const t = recortar(f[i] == null ? "" : f[i], anchos[i] - 2.5);
      doc.text(t, numerica[i] ? xs[i] + anchos[i] - 2.5 : xs[i], y, { align: numerica[i] ? "right" : "left" });
    });
    doc.setDrawColor(...PDF_LINEA);
    doc.line(M - 3, y + 2, W - M + 3, y + 2);
    y += 6;
    fila++;
  }

  if(R.nota){
    y += 4;
    doc.setFont("helvetica", "normal"); doc.setFontSize(8); doc.setTextColor(...PDF_GRIS);
    for(const l of doc.splitTextToSize(R.nota, util)){ doc.text(l, M, y); y += 4; }
  }

  pieRex(doc, W, H, "Rex+  ·  " + nombreRep, "Página " + doc.getNumberOfPages());
  const archivo = "reporte-" + A.rep.tipo + "-" + hoy() + ".pdf";
  try{ doc.save(archivo); avisar("PDF descargado"); }
  catch(e){
    try{ window.open(doc.output("bloburl"), "_blank"); }
    catch(e2){ avisar("No se pudo generar el PDF"); }
  }
}

      '<button class="btn btn-linea btn-w" style="margin-top:8px" data-accion="exportar-reporte">Exportar a CSV</button>' : "");

function textoPeriodo(){
  const r = A.rep;
  if(r.desde || r.hasta){
    if(r.desde && r.hasta) return fechaCorta(r.desde) + " a " + fechaCorta(r.hasta);
    return r.desde ? "desde " + fechaCorta(r.desde) : "hasta " + fechaCorta(r.hasta);
  }
  const p = (PERIODOS.find(x => x[0] === r.periodo) || ["", "Todo"])[1];
  const extra = [];
  if(r.situacion && r.situacion !== "Todas") extra.push(r.situacion);
  if(r.categoria && r.categoria !== "Todas") extra.push(r.categoria);
  if(r.proveedorId && proveedor(r.proveedorId)) extra.push(proveedor(r.proveedorId).nombre);
  return p + (extra.length ? " · " + extra.join(" · ") : "");
}

function descargarCSV(nombre, cab, filas){
  const csv = [cab, ...filas].map(f => f.map(v =>
    '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"').join(",")).join("\n");
  try{
    const url = URL.createObjectURL(new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8" }));
    const a = document.createElement("a");
    a.href = url; a.download = nombre + ".csv";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
    avisar("CSV descargado");
  }catch(e){
    abrirModal('<p class="mini">Copia este texto y pégalo en Excel:</p><textarea class="inp" rows="12">' + esc(csv) + '</textarea>', "Exportar");
  }
}

async function guardarModelo(){
  const codigo = val("codigo");
  if(!codigo) return avisar("Falta el código del modelo");
  if(A.modelos.find(m => m.codigo === codigo && m.id !== ctx.id)) return avisar("Ya existe un modelo con ese código");
  const num = id => val(id) === "" ? null : Number(val(id));
  const ficha = { peso: num("peso"), largo: num("largo"), alto: num("alto"), ancho: num("ancho"),
    garantia: num("garantia"), alimentacion: val("alimentacion"), capacidad: val("capacidad"),
    conectividad: val("conectividad"), url: val("url"), notas: val("notas") };
  Object.keys(ficha).forEach(k => { if(ficha[k] === "" || ficha[k] == null) delete ficha[k]; });
  const func = {};
  FUNCIONES.forEach(([k]) => { func[k] = val("fn-" + k) || "no"; });
  const datos = {
    codigo, modelo: val("modelo"), nombre: val("nombre"), categoria: val("categoria"),
    ventaUF: val("ventaUF") ? Number(val("ventaUF")) : null,
    arriendoUF: val("arriendoUF") ? Number(val("arriendoUF")) : null,
    minimo: Number(val("minimo")) || 0,
    activo: val("activo") !== "No",
    proveedorId: val("proveedorId") || "",
    ficha: ficha, func: func
  };
  let m;
  if(ctx.id){ m = A.modelos.find(x => x.id === ctx.id); Object.assign(m, datos); }
  else { m = Object.assign({ id: uuid(), fotos: [], activo: true }, datos); A.modelos.push(m); }
  for(const fid of ctx.originales){
    if(!ctx.fotos.some(f => f.id === fid)){ await Store.del(fotoKey(fid)); delete A.fotos[fid]; }
  }
  for(const f of ctx.fotos){ if(A.fotos[f.id] !== f.data) await guardarFoto(f.id, f.data); }
  m.fotos = ctx.fotos.map(f => f.id);
  await persistir("modelos", m);
  const nuevo = !ctx.id;
  cerrarModal(); pintar(); avisar(nuevo ? "Modelo agregado" : "Ficha actualizada");
}

async function guardarUnidad(accion){
  const prev = ctx.id ? A.unidades.find(x => x.id === ctx.id) : null;
  const serie = prev ? prev.serie : val("serie");
  if(!serie) return avisar("Falta el número de serie");
  if(!A.modelos.length) return avisar("Primero crea al menos un modelo");
  let cliente = val("cliente"), entrega = val("entrega");
  if(accion === "devolver"){ cliente = ""; entrega = ""; }
  /* La situación sale de los datos: con cliente o fecha de entrega el equipo está entregado.
     Los estados especiales se fijan con los botones. */
  const especiales = ["Reservado", "En revisión", "Baja"];
  let situacion;
  if(accion === "revision") situacion = "En revisión";
  else if(accion === "baja") situacion = "Baja";
  else if(accion === "devolver" || accion === "disponible") situacion = "Disponible";
  else if(cliente || entrega) situacion = "Entregado";
  else situacion = (prev && especiales.indexOf(prev.situacion) >= 0) ? prev.situacion : "Disponible";
  const datos = {
    /* el modelo viene definido al ingresar el equipo y no se cambia acá */
    serie, codigo: prev ? prev.codigo : "", situacion: situacion, estado: val("estado"),
    ubicacion: val("ubicacion"), cliente: cliente, entrega: entrega,
    tipo: val("tipo") === "—" ? "" : val("tipo"), vendedor: val("vendedor"), instalador: val("instalador"), obs: val("obs"),
    /* la compra se define al ingresar el equipo: acá se conserva tal cual */
    proveedorId: prev ? prev.proveedorId : "", facturaId: prev ? prev.facturaId : "",
    oc: prev ? prev.oc : "", costo: prev ? prev.costo : null,
    ingreso: prev ? prev.ingreso : hoy()
  };
  let u, txt;
  if(ctx.id){
    u = A.unidades.find(x => x.id === ctx.id);
    const antes = u.situacion;
    Object.assign(u, datos);
    txt = antes !== u.situacion ? "Cambio de situación: " + antes + " → " + u.situacion : "Datos actualizados";
  } else {
    u = Object.assign({ id: uuid() }, datos);
    A.unidades.push(u);
    txt = "Alta de equipo " + u.codigo;
  }
  if(ctx.fotoCambiada) await guardarFoto("u" + u.id, ctx.foto);
  await persistir("unidades", u);
  registrar(txt, u.serie);
  cerrarModal(); pintar(); avisar(ctx.id ? "Equipo actualizado" : "Equipo agregado");
}

const COLS_IMPORT = [
  ["serie",      ["serie", "n serie", "numero de serie", "n de serie", "serial"]],
  ["codigo",     ["codigo", "código", "cod", "modelo", "sku", "equipo"]],
  ["situacion",  ["situacion", "situación", "status", "estado"]],
  ["ingreso",    ["fecha de ingreso", "fecha ingreso", "ingreso"]],
  ["entrega",    ["fecha de entrega", "fecha entrega", "entrega"]],
  ["cliente",    ["cliente", "empresa"]],
  ["tipo",       ["tipo", "modalidad"]],
  ["instalador", ["instalador"]],
  ["vendedor",   ["vendedor", "ejecutivo"]],
  ["proveedor",  ["proveedor", "proveedor equipo", "suministrador"]]
];

let xlsxListo = null;
function cargarXLSX(){
  if(xlsxListo) return xlsxListo;
  xlsxListo = new Promise((ok, fail) => {
    if(window.XLSX) return ok(window.XLSX);
    const s = document.createElement("script");
    s.src = "xlsx.mini.min.js";
    s.onload = () => window.XLSX ? ok(window.XLSX) : fail(new Error("No se pudo cargar el lector de Excel"));
    s.onerror = () => fail(new Error("Falta el archivo xlsx.mini.min.js"));
    document.head.appendChild(s);
  });
  return xlsxListo;
}

const sinTildes = s => String(s == null ? "" : s).normalize("NFD").replace(/[\u0300-\u036f]/g, "")
  .replace(/\s+/g, " ").trim().toLowerCase();

/* Compara códigos ignorando guiones, espacios, puntos y mayúsculas:
   "ZK-IN05A", "zk in05 a" y "ZK-IN05-A" son el mismo modelo. */
const codigoNorm = c => sinTildes(c).replace(/[\s\-_.\/]/g, "").toUpperCase();

function columnaDe(encabezado){
  const e = sinTildes(encabezado);
  for(const [campo, alias] of COLS_IMPORT) if(alias.indexOf(e) >= 0) return campo;
  return null;
}

function fechaISO(v){
  if(!v && v !== 0) return "";
  if(v instanceof Date && !isNaN(v)){
    return new Date(v.getTime() - v.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  }
  const t = String(v).trim();
  if(/^\d{4}-\d{2}-\d{2}/.test(t)) return t.slice(0, 10);
  const m = t.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);   // dd/mm/aaaa
  if(m){
    const a = m[3].length === 2 ? "20" + m[3] : m[3];
    return a + "-" + ("0" + m[2]).slice(-2) + "-" + ("0" + m[1]).slice(-2);
  }
  const n = Number(t);                                                // número de serie de Excel
  if(n > 20000 && n < 60000){
    const d = new Date(Date.UTC(1899, 11, 30) + n * 86400000);
    return d.toISOString().slice(0, 10);
  }
  return "";
}

function situacionDe(txt, cliente){
  const s = sinTildes(txt);
  if(s.indexOf("no disponible") >= 0 || s.indexOf("entregad") >= 0) return "Entregado";
  if(s.indexOf("revis") >= 0) return "En revisión";
  if(s.indexOf("baja") >= 0) return "Baja";
  if(s.indexOf("reserv") >= 0) return "Reservado";
  if(s.indexOf("disponible") >= 0) return "Disponible";
  return cliente ? "Entregado" : "Disponible";
}

function tipoDe(txt){
  const s = sinTildes(txt);
  if(s.indexOf("arrien") >= 0) return "Arriendo";
  if(s.indexOf("vent") >= 0) return "Venta";
  if(s.indexOf("prest") >= 0) return "Préstamo";
  return "";
}

async function leerExcelEquipos(file){
  const XLSX = await cargarXLSX();
  const buf = await file.arrayBuffer();
  const libro = XLSX.read(buf, { type: "array", cellDates: true });
  const hoja = libro.Sheets[libro.SheetNames[0]];
  if(!hoja) throw new Error("El archivo no tiene hojas");
  const crudas = XLSX.utils.sheet_to_json(hoja, { defval: "", raw: true });
  if(!crudas.length) throw new Error("La hoja está vacía");

  const mapa = {};
  for(const k in crudas[0]){ const c = columnaDe(k); if(c) mapa[k] = c; }
  if(!Object.values(mapa).some(v => v === "serie"))
    throw new Error("No encuentro la columna Serie. Revisa los encabezados de la primera fila.");

  const series = new Set(A.unidades.map(u => u.serie.toLowerCase()));
  const codigos = new Set(A.modelos.map(m => m.codigo));
  const equivalentes = {};                       // código normalizado -> código real del catálogo
  for(const m of A.modelos) equivalentes[codigoNorm(m.codigo)] = m.codigo;
  const provs = {};                              // nombre normalizado -> proveedor existente
  for(const p of A.proveedores) provs[sinTildes(p.nombre)] = p;
  const provReconocidos = {}, provNuevos = new Set();
  const vistas = new Map();                      // serie normalizada -> fila del archivo
  const filas = [];
  const descartadas = [];                        // por qué no entra cada una
  let repetidas = 0, sinSerie = 0;
  const nuevosCodigos = new Set(), ajustados = {};

  let nFila = 1;                                 // fila 1 son los encabezados
  for(const cruda of crudas){
    nFila++;
    const f = { serie: "", codigo: "", situacion: "", ingreso: "", entrega: "", cliente: "", tipo: "",
      instalador: "", vendedor: "", proveedor: "", proveedorId: "" };
    for(const k in mapa) f[mapa[k]] = String(cruda[k] == null ? "" : cruda[k]).trim();
    f.serie = f.serie.trim();
    if(!f.serie){
      sinSerie++;
      descartadas.push({ serie: "(sin serie)", fila: nFila, motivo: "La fila no trae número de serie", info: "" });
      continue;
    }
    const k = f.serie.toLowerCase();
    if(series.has(k)){
      repetidas++;
      const u = A.unidades.find(x => x.serie.toLowerCase() === k);
      descartadas.push({ serie: f.serie, fila: nFila, motivo: "Ya está en el inventario",
        info: u ? (u.codigo + " · " + u.situacion + (u.cliente ? " · " + u.cliente : "") +
          (u.ingreso ? " · ingresó " + fechaCorta(u.ingreso) : "")) : "" });
      continue;
    }
    if(vistas.has(k)){
      repetidas++;
      descartadas.push({ serie: f.serie, fila: nFila,
        motivo: "Repetida en el archivo", info: "ya aparece en la fila " + vistas.get(k) });
      continue;
    }
    vistas.set(k, nFila);
    f.ingreso = fechaISO(buscarValor(cruda, mapa, "ingreso"));
    f.entrega = fechaISO(buscarValor(cruda, mapa, "entrega"));
    f.tipo = tipoDe(f.tipo);
    f.situacion = situacionDe(f.situacion, f.cliente);
    if(f.proveedor){
      const clave = sinTildes(f.proveedor);
      const p = provs[clave];
      if(p){ f.proveedorId = p.id; provReconocidos[f.proveedor] = p.nombre; }
      else { f.proveedorId = ""; provNuevos.add(f.proveedor.trim()); }
    }
    const original = f.codigo.trim() || "SIN-CODIGO";
    const real = equivalentes[codigoNorm(original)];
    if(real && real !== original) ajustados[original] = real;
    f.codigo = real || original;
    if(!codigos.has(f.codigo)) nuevosCodigos.add(f.codigo);
    filas.push(f);
  }
  return { filas: filas, repetidas: repetidas, sinSerie: sinSerie,
    nuevos: [...nuevosCodigos], ajustados: ajustados, descartadas: descartadas,
    provReconocidos: provReconocidos, provNuevos: [...provNuevos],
    columnas: Object.values(mapa), total: crudas.length };
}

function buscarValor(cruda, mapa, campo){
  for(const k in mapa) if(mapa[k] === campo) return cruda[k];
  return "";
}

async function asignarCliente(){

  if(!us.length) return cerrarModal();
  const entrega = val("as-entrega"), tipo = val("as-tipo"), vendedor = val("as-vendedor"),
        instalador = val("as-instalador"), ubicacion = val("as-ubicacion");
  for(const u of us){
    u.cliente = cliente;
    u.situacion = "Entregado";
    if(entrega) u.entrega = entrega;
    if(tipo && tipo !== "—") u.tipo = tipo;
    if(vendedor) u.vendedor = vendedor;
    if(instalador) u.instalador = instalador;
    if(ubicacion) u.ubicacion = ubicacion;

  registrar("Entrega de " + us.length + " equipos a " + cliente, us.length === 1 ? us[0].serie : "");
  A.selEq = {};
  if(REMOTO && !A.sinGuardar) await sincronizar(true);
  cerrarModal(); pintar();
  avisar(us.length + (us.length === 1 ? " equipo asignado a " : " equipos asignados a ") + cliente);

async function guardarCambioModelo(){
  const u = A.unidades.find(x => x.id === ctx.id);
  const nuevo = val("cm-codigo");
  if(!u || !nuevo || nuevo === u.codigo) return cerrarModal();
  const antes = u.codigo;
  u.codigo = nuevo;
  await persistir("unidades", u);
  registrar("Cambio de modelo: " + antes + " → " + nuevo, u.serie);

  /* Se le pregunta al servidor cómo quedó la serie: si no cambió, se avisa en vez
     de mostrar un conteo que no corresponde. */
  if(REMOTO && !A.sinGuardar){
    try{
      const r = await API.req("GET", "unidades?select=serie,codigo&serie=eq." + encodeURIComponent(u.serie));
      if(r && r[0] && r[0].codigo !== nuevo){
        A.sinGuardar = true;
        A.ultimoError = "El servidor conservó " + r[0].codigo + " para la serie " + u.serie +
          ", el cambio a " + nuevo + " no quedó guardado.";
      }
    }catch(e){ fallo(e, "unidades"); }
    if(!A.sinGuardar) await sincronizar(true);
  }
  cerrarModal(); pintar();
  if(A.sinGuardar) return avisar("El cambio no quedó guardado. Revisa el aviso rojo.");
  avisar(antes + " queda con " + unidadesDe(antes).length + " · " + nuevo + " con " + unidadesDe(nuevo).length);
}

        (on ? '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="4"><path d="M5 13l4 4L19 7"/></svg>' : "") + '</button>' +

async function vaciarEquipos(){
  const escrito = (document.getElementById("v-confirma") || { value: "" }).value.trim().toUpperCase();
  if(escrito !== "VACIAR") return avisar("Escribe VACIAR para confirmar");
  const elegidos = elegidosVaciar();
  if(!elegidos.length) return cerrarModal();
  const codigos = elegidos.map(x => x.m.codigo);
  const fuera = A.unidades.filter(u => codigos.indexOf(u.codigo) >= 0);
  const n = fuera.length;

  for(const u of fuera) await Store.del(fotoKey("u" + u.id));
  A.unidades = A.unidades.filter(u => codigos.indexOf(u.codigo) < 0);
  if(REMOTO){
    for(const c of codigos){
      try{ await API.req("DELETE", "unidades?codigo=eq." + encodeURIComponent(c)); }
      catch(e){ fallo(e, "unidades"); return cerrarModal(); }
    }
  } else await guardar("unidades");

  /* los modelos que creó una importación y quedaron sin equipos se van con ellos */
  const huerfanos = A.modelos.filter(m => m.categoria === "Sin clasificar" &&
    codigos.indexOf(m.codigo) >= 0 && !A.unidades.some(u => u.codigo === m.codigo));
  for(const m of huerfanos){
    A.modelos = A.modelos.filter(x => x.id !== m.id);
    await borrarFila("modelos", m.id);
  }
  if(!REMOTO) await guardar("modelos");

  registrar("Se vaciaron " + n + " equipos de " + codigos.length + " modelos", "");
  cerrarModal(); pintar();
  avisar(n + " equipos eliminados. El catálogo quedó intacto.");
}

/* --- deshacer la última importación --- */
function ultimaImportacion(){
  const lotes = {};
  for(const u of A.unidades){
    if(!u.lote) continue;
    const l = lotes[u.lote] = lotes[u.lote] || { lote: u.lote, n: 0, fecha: "" };
    l.n++;
    const f = String(u.creado || "");
    if(f > l.fecha) l.fecha = f;
  }
  const arr = Object.values(lotes).sort((a, b) => (b.fecha || "").localeCompare(a.fecha || ""));
  return arr.length ? arr[0] : null;
}
